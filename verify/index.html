<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy-deep: #1a2a3a;
    --navy: #1E3A5F;
    --light-blue: #7ec8e3;
    --light-blue-soft: #E8F4FD;
    --tag-bg: #EFF6FF;
    --tag-text: #2563EB;
    --rating-bg: #FFF8EC;
    --rating-text: #FF9500;
    --rating-stars: #FFBB33;
    --green: #4CAF50;
    --green-bg: #F0FFF4;
    --green-bg-soft: rgba(76,175,80,0.15);
    --green-border: rgba(76,175,80,0.3);
    --bg: #F5F0E8;
    --text: #111;
    --text-soft: #555;
    --text-subtle: #999;
    --text-muted: #bbb;
    --border-soft: #F0F0F0;
    --section-bg: #FAFAFA;

  html, body {
    background: var(--bg);
    font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }

  body {
    min-height: 100vh;
  }

  .container {
    max-width: 480px;
    margin: 0 auto;
    background: var(--bg);
    min-height: 100vh;
  }

  /* ===== 다크 헤더 (떠있는 카드 느낌) ===== */
  .top-header {
    background: var(--navy-deep);
    margin: 16px 16px 0;
    padding: 22px 24px 56px;
    border-radius: 28px;
    position: relative;
    z-index: 0;
    box-shadow: 0 12px 32px rgba(15, 36, 66, 0.18);
  }
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }
  .brand-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .brand-name {
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.2px;
  }
  .brand-en {
    font-size: 11px;
    color: rgba(255,255,255,0.45);
    letter-spacing: 0.4px;
  }
  /* VERIFIED REVIEW 앞 골드 인증 마크 (Material Icons.verified_rounded와 동일) */
  /* 다크 네이비 배경에서 명확히 보이도록 밝은 골드 톤 사용 */
  .verified-mark {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    display: inline-block;
    margin-right: 7px;
  }
  .verified-mark path {
    fill: #E8C46B;
  }
  .verified-eyebrow-row {
    display: flex;
    align-items: center;
    margin-bottom: 6px;
  }

  .verified-banner {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 16px 20px;
  }
  .verified-eyebrow {
    font-size: 12px;
    color: rgba(255,255,255,0.45);
    letter-spacing: 0.5px;
  }
  .verified-title {
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 4px;
    letter-spacing: -0.3px;
  }
  .verified-sub {
    font-size: 12px;
    color: rgba(255,255,255,0.4);
  }

  /* ===== 메인 카드 (오버랩) ===== */

    margin: -36px 16px 0;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    overflow: hidden;
    position: relative;
    z-index: 1;

  /* 비즈니스 + 별점 섹션 */

    border-bottom: 1px solid var(--border-soft);

  .tags-row {

    flex-wrap: wrap;
    gap: 8px;

    letter-spacing: -0.1px;

  /* 작성자 */

    display: flex;
    align-items: center;

  .check-box {

    display: flex;
    align-items: center;

  .check-box-icon {

  .evidence-text {

  .evidence-value {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }
  .evidence-value.green {
    color: var(--green);
  }
  .evidence-sub {
    padding-left: 26px;
    margin-top: 4px;
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  /* 인증번호 박스 */
  .cert-box {
    background: var(--navy-deep);
    border-radius: 16px;
    padding: 20px;
    text-align: center;
  }
  .cert-label {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 1px;
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  .cert-code {
    font-family: 'Menlo', 'SF Mono', monospace;
    font-size: 32px;
    font-weight: 700;

  /* 푸터 */

    padding: 20px 24px;
    text-align: center;
  }

    color: #aaa;

  .footer-disclaimer {

  /* ===== 상태 메시지 (404, hidden, error) ===== */

    text-align: center;

  .state-title {

    font-weight: 700;

    line-height: 1.6;
  }
  .home-btn {
    display: inline-block;
    margin-top: 24px;
    padding: 10px 22px;
    background: var(--navy-deep);
    color: white;
    text-decoration: none;
    border-radius: 100px;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: -0.1px;
  }

  /* 로딩 skeleton */
  .skeleton {
    background: linear-gradient(90deg, #F0F0F0 0%, #F8F8F8 50%, #F0F0F0 100%);
    background-size: 200% 100%;
    animation: shimmer 1.4s ease infinite;
    border-radius: 6px;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .loading-state {
    padding: 60px 24px;
    text-align: center;
  }
  .loading-state .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #E5E5E5;
    border-top-color: var(--navy-deep);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .loading-text {
    font-size: 13px;
    color: var(--text-subtle);
  }
</style>

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// 태그 → 이모지 매핑 (앱과 동기화)
const TAG_EMOJI = {
  '꼼꼼함': '🔍',
  '깔끔한 마무리': '✨',
  '친환경 자재': '🌱',
  '친절함': '😊',
  '시간 엄수': '⏰',
  '실시간 리포트': '📱',
  '빠른 작업': '⚡',
  '꼼꼼한 설명': '💬',
  '재예약 의사': '🔁',
};

// ===== 유틸 =====
function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function maskPhoneTail(phone) {
  if (!phone) return '';
  const digits = phone.replace(/\D/g, '');
  if (digits.length < 2) return '';
  const last2 = digits.slice(-2);
  if (digits.length >= 11) {
    return `(${digits.substring(0, 3)}-****-**${last2})`;
  }
  return `(****-**${last2})`;
}

function maskName(name) {
  if (!name) return null;
  if (name.length === 1) return name;
  if (name.length === 2) return name[0] + '○';
  return name[0] + '○'.repeat(name.length - 2) + name[name.length - 1];
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' })
    .replace(/\s/g, '').replace(/\.$/, '');
}

function getCertCode() {
  // /verify/ZY25 또는 /verify/?c=ZY25
  const pathMatch = window.location.pathname.match(/\/verify\/([A-Z0-9]{4})\/?$/i);
  if (pathMatch) return pathMatch[1].toUpperCase();
  const params = new URLSearchParams(window.location.search);
  const c = params.get('c');
  if (c) return c.toUpperCase().replace(/[^A-Z0-9]/g, '');
  return null;
}

function cmLogo(size = 'large') {
  // 앱 splash 로고와 동일 (/assets/cm_logo.png)
  const w = size === 'small' ? 36 : 38;
  return `<img src="/assets/cm_logo.png" alt="클리닝매니저" style="width:${w}px;height:${w}px;object-fit:contain;display:block;" />`;
}

function renderStars(rating) {
  const r = Math.max(0, Math.min(5, parseInt(rating) || 0));
  return '★'.repeat(r) + '<span class="empty">' + '★'.repeat(5 - r) + '</span>';
}

// ===== 상태 렌더 =====
function renderError(title, desc) {
  document.getElementById('container').innerHTML = `
    <div class="state-message">
      <div class="state-icon">🔍</div>
      <div class="state-title">${escapeHtml(title)}</div>
      <div class="state-desc">${escapeHtml(desc)}</div>
      <a class="home-btn" href="/">홈으로</a>
    </div>
  `;
}

function renderHidden(certCode) {
  document.getElementById('container').innerHTML = `
    <div class="state-message">
      <div class="state-icon">🔒</div>
      <div class="state-title">비공개 처리된 후기</div>
      <div class="state-desc">이 후기는 현재 비공개 상태입니다.<br>인증번호 #${escapeHtml(certCode)}</div>
      <a class="home-btn" href="/">홈으로</a>
    </div>
  `;
}

function renderCert(data) {
  const r = data.review;
  const businessName = data.business?.name || '업체';
  const businessLogo = data.business?.logo_url;
  const evidence = data.evidence;

  const customerName = (r.name_display === 'anonymous')
    ? '익명'
    : (maskName(r.customer_name_snapshot) || null);
  const phoneTail = (r.name_display === 'anonymous') ? '' : maskPhoneTail(r.customer_phone_snapshot);
  const authorDisplay = customerName
    ? `${customerName} 고객님${phoneTail ? ' ' + phoneTail : ''}`
    : '고객님';

  const serviceDate = fmtDate(r.scheduled_date_snapshot || r.bookings?.scheduled_date);
  const createdDate = fmtDate(r.created_at);
  const wasEdited = r.updated_at && (new Date(r.updated_at) - new Date(r.created_at)) > 60000;

          ${escapeHtml(t)}

  document.getElementById('container').innerHTML = `
    <!-- 다크 헤더 -->
    <header class="top-header">
      <div class="top-bar">
        <a class="brand" href="/">
          ${cmLogo('large')}
          <div class="brand-text">
            <div class="brand-name">클리닝매니저</div>
            <div class="brand-en">청소업체 운영 시스템</div>
          </div>
        </a>
      </div>
      <div class="verified-banner">
        <div class="verified-eyebrow-row">
          <svg class="verified-mark" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path d="M23 12l-2.44-2.78.34-3.68-3.61-.82-1.89-3.18L12 3 8.6 1.54 6.71 4.72 3.1 5.53l.34 3.69L1 12l2.44 2.78-.34 3.69 3.61.82 1.89 3.18L12 21l3.4 1.46 1.89-3.18 3.61-.82-.34-3.68L23 12zm-12.91 4.72l-3.8-3.81 1.48-1.48 2.32 2.33 5.85-5.87 1.48 1.48-7.33 7.35z"/>
          </svg>
          <span class="verified-eyebrow">VERIFIED REVIEW</span>
        </div>
        <div class="verified-title">실제 서비스 완료 후 수집된 후기</div>
        <div class="verified-sub">클리닝매니저 시스템이 검증한 진짜 후기입니다</div>
      </div>
    </header>

    <!-- 메인 카드 -->
    <article class="main-card">
      <!-- 비즈니스 + 별점 -->
      <section class="biz-section">
        <div class="biz-row">
          <div class="biz-logo">${bizLogoHtml}</div>
          <div class="biz-info">
            <div class="biz-name">${escapeHtml(businessName)}</div>
            <div class="biz-service">${escapeHtml(r.service_type_snapshot || '')}${serviceDate ? ` · ${serviceDate}` : ''}</div>
          </div>
        </div>
        <div class="rating-row">
          <span class="stars">${renderStars(r.rating)}</span>

          </div>
        </div>
      </section>

      <!-- 본문 -->

        <section class="content-section">
          <p class="content-text">${escapeHtml(r.content)}</p>
        </section>
      ` : ''}

      <!-- 태그 -->
      ${tagsHtml ? `

          </div>
        </div>
        <div class="author-verified">
          <span class="author-verified-icon">✓</span>
          <span class="author-verified-text">본인 작성</span>
        </div>
      </section>

      <!-- 검증 정보 -->
      <section class="verify-section">
        <div class="verify-title">검증된 청소 정보</div>
        <div class="evidence-list">
          ${evidence.itemCount != null ? `
            <div class="evidence-item">
              <div class="evidence-row">
                <div class="evidence-label">
                  <div class="check-box"><span class="check-box-icon">✓</span></div>
                  <span class="evidence-text">청소 완료 구역</span>
                </div>
                <span class="evidence-value">${evidence.itemCount}구역</span>
              </div>
            </div>
          ` : ''}

          ${evidence.photoCount != null ? `
            <div class="evidence-item">
              <div class="evidence-row">
                <div class="evidence-label">
                  <div class="check-box"><span class="check-box-icon">✓</span></div>
                  <span class="evidence-text">구역별 전/후 사진</span>
                </div>
                <span class="evidence-value">${evidence.photoCount}장</span>
              </div>
            </div>
          ` : ''}

          <div class="evidence-item">
            <div class="evidence-row">
              <div class="evidence-label">
                <div class="check-box"><span class="check-box-icon">✓</span></div>
                <span class="evidence-text">고객만 작성 가능</span>
              </div>
              <span class="evidence-value green">위변조 불가</span>
            </div>
            <div class="evidence-sub">카카오톡으로 전송된 개인 링크로 본인만 작성할 수 있어요</div>
          </div>

          <div class="evidence-item">
            <div class="evidence-row">
              <div class="evidence-label">
                <div class="check-box"><span class="check-box-icon">✓</span></div>
                <span class="evidence-text">고객만 수정 가능</span>
              </div>
              <span class="evidence-value">30일 이내</span>
            </div>
            <div class="evidence-sub">해당 링크로 접속한 고객 본인만 수정할 수 있어요</div>
          </div>
        </div>

        <!-- 인증번호 박스 -->
        <div class="cert-box">
          <div class="cert-label">인증번호</div>
          <div class="cert-code">#${escapeHtml(certCode)}</div>
        </div>
      </section>
    </article>

    <!-- 푸터 -->
    <footer class="footer">
      <p class="footer-text">
        이 페이지는 클리닝매니저가 발급한<br>
        공식 후기 인증 페이지입니다
      </p>
      <p class="footer-disclaimer">
        본 서비스는 ${escapeHtml(businessName)}이 제공하며,<br>
        클리닝매니저는 후기 검증 시스템입니다
      </p>
    </footer>
  `;
}

// 클리닝매니저 로고 SVG는 글로벌에서 접근 가능해야 함
window.cmLogo = cmLogo;

// ===== 메인 진입점 =====
async function init() {
  const certCode = getCertCode();
  if (!certCode) {
    renderError('인증번호를 찾을 수 없어요', '올바른 인증 URL로 접속해주세요.');
    return;
  }

  try {
    // 1) 후기 + 예약·업체 조인 조회
    const { data: review, error } = await sb
      .from('reviews')
      .select(`
        rating, content, tags, created_at, updated_at, is_hidden,
        cert_code, customer_name_snapshot, customer_phone_snapshot, service_type_snapshot, name_display,
        scheduled_date_snapshot, address_snapshot,
        report_id, booking_id,
        bookings ( scheduled_date, address ),
        companies ( name, logo_url )
      `)
      .eq('cert_code', '#' + certCode)
      .maybeSingle();

    if (error) {
      console.error('cert query error', error);
      renderError('조회 중 문제가 발생했어요', '잠시 후 다시 시도해주세요.');
      return;
    }

    if (!review) {
      renderError('인증번호를 찾을 수 없어요', `#${certCode}는 유효하지 않은 인증번호입니다.`);
      return;
    }

    if (review.is_hidden) {
      renderHidden(certCode);
      return;
    }

    // 2) 검증 정보용 카운트 (병렬)
    const [itemRes, photoRes] = await Promise.all([
      review.report_id
        ? sb.from('report_entries').select('id', { count: 'exact', head: true }).eq('report_id', review.report_id)
        : Promise.resolve({ count: null }),
      review.report_id
        ? sb.from('report_photos').select('id', { count: 'exact', head: true }).eq('report_id', review.report_id)
        : Promise.resolve({ count: null }),
    ]);

    renderCert({
      review,
      business: review.companies || {},
      evidence: {
        itemCount: itemRes.count,
        photoCount: photoRes.count,
      },
    });
  } catch (e) {
    console.error('cert init error', e);
    renderError('조회 중 문제가 발생했어요', '잠시 후 다시 시도해주세요.');
  }
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
