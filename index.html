<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>청소 리포트</title>
<meta property="og:title" content="프리미엄 청소 리포트">
<meta property="og:description" content="실시간 청소 현황을 확인하세요">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #F2F3EE;
    color: #1a1a1a;
    max-width: 500px;
    margin: 0 auto;
    min-height: 100vh;
  }

  /* 헤더 */
  .header {
    background: #1E293B;
    color: white;
    padding: 12px 16px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .company-info {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .company-logo {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    object-fit: cover;
  }
  .company-name {
    font-size: 15px;
    font-weight: 700;
  }
  .live-badge {
    display: flex;
    align-items: center;
    gap: 4px;
    background: rgba(239,68,68,0.15);
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 10px;
    font-weight: 700;
    color: #EF4444;
  }
  .live-dot {
    width: 6px;
    height: 6px;
    background: #EF4444;
    border-radius: 50%;
    animation: pulse 1.5s infinite;
  }
  .completed-badge {
    background: rgba(74,157,91,0.15);
    color: #4A9D5B;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  @keyframes pulse-ring {
    0% { transform: scale(1); opacity: 0.6; }
    100% { transform: scale(2.2); opacity: 0; }
  }
  .customer-info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .customer-name {
    font-size: 14px;
    font-weight: 600;
  }
  .customer-date {
    font-size: 12px;
    opacity: 0.6;
  }
  .company-call {
    font-size: 9px;
    color: rgba(255,255,255,0.45);
    text-decoration: none;
    margin-left: 6px;
    border: 1px solid rgba(255,255,255,0.15);
    padding: 2px 8px;
    border-radius: 8px;
    font-weight: 600;
    vertical-align: middle;
  }
  .company-call:active {
    background: rgba(255,255,255,0.1);
  }
  .progress-bar-bg {
    background: rgba(255,255,255,0.15);
    border-radius: 6px;
    height: 6px;
    overflow: hidden;
  }
  .progress-bar-fill {
    background: #4A9D5B;
    height: 100%;
    border-radius: 6px;
    transition: width 0.5s ease;
  }
  .progress-text {
    font-size: 11px;
    opacity: 0.6;
    margin-top: 4px;
    text-align: right;
  }

  /* 메인 탭 */
  .main-tabs {
    display: flex;
    background: white;
    border-bottom: 1px solid #E5E5DC;
    position: sticky;
    top: 0;
    z-index: 99;
  }
  .main-tab {
    flex: 1;
    padding: 14px;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    color: #94a3b8;
    cursor: pointer;
    border-bottom: 2.5px solid transparent;
    transition: all 0.2s;
  }
  .main-tab.active {
    color: #1a1a1a;
    border-bottom-color: #4A7C59;
  }
  .main-tab .tab-count {
    display: inline-block;
    background: #4A7C59;
    color: white;
    font-size: 10px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 8px;
    margin-left: 4px;
  }
  .main-tab .defect-count {
    background: #E65100;
  }

  /* 콘텐츠 */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* 아코디언 */
  .accordion-list {
    padding: 10px 12px;
  }
  .accordion-item {
    background: white;
    border-radius: 14px;
    border: 1px solid #E5E5DC;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .accordion-header {
    display: flex;
    align-items: center;
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
  }
  .accordion-icon {
    font-size: 22px;
    margin-right: 10px;
  }
  .accordion-title {
    font-size: 14px;
    font-weight: 700;
    flex: 1;
  }
  .accordion-count {
    font-size: 11px;
    color: #94a3b8;
    margin-right: 8px;
  }
  .accordion-status {
    font-size: 9px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 8px;
    margin-right: 8px;
  }
  .status-waiting { background: #F1F3EE; color: #94a3b8; }
  .status-progress { background: #FEF0E0; color: #E67E22; }
  .status-done { background: #E4F3E6; color: #4A9D5B; }
  .accordion-arrow {
    font-size: 12px;
    color: #94a3b8;
    transition: transform 0.2s;
  }
  .accordion-item.open .accordion-arrow {
    transform: rotate(180deg);
  }
  .accordion-body {
    display: none;
    border-top: 1px solid #F1F3EE;
  }
  .accordion-item.open .accordion-body {
    display: block;
  }

  /* 카테고리 내부 탭 */
  .sub-tabs {
    display: flex;
    border-bottom: 1px solid #F1F3EE;
  }
  .sub-tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    color: #94a3b8;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .sub-tab.active {
    color: #C47F17;
    border-bottom-color: #C47F17;
  }
  .sub-tab.after-active {
    color: #4A9D5B;
    border-bottom-color: #4A9D5B;
  }
  .sub-tab .count {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    color: white;
    padding: 0 5px;
    border-radius: 8px;
    margin-left: 3px;
  }
  .sub-tab .count.before { background: #C47F17; }
  .sub-tab .count.after { background: #4A9D5B; }

  .sub-content { display: none; padding: 10px; }
  .sub-content.active { display: block; }

  /* 피드 카드 */
  .feed-card {
    background: white;
    border-radius: 12px;
    border: 1px solid #E5E5DC;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .feed-card.defect {
    background: #FFF8E1;
    border-color: #FFD54F;
  }
  .feed-header {
    display: flex;
    align-items: center;
    padding: 10px 12px;
    gap: 6px;
  }
  .feed-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }
  .feed-dot.before { background: #C47F17; }
  .feed-dot.after { background: #4A9D5B; }
  .feed-time {
    font-size: 11px;
    color: #94a3b8;
  }
  .defect-label {
    font-size: 11px;
    font-weight: 700;
    color: #E65100;
  }
  .feed-memo {
    padding: 0 12px 8px;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.4;
  }
  .feed-memo.defect-memo {
    background: #FFF3CD;
    margin: 0 12px 8px;
    padding: 6px 10px;
    border-radius: 8px;
    color: #E65100;
  }
  .feed-photos {
    display: grid;
    gap: 2px;
  }
  .feed-photos.one { grid-template-columns: 1fr; }
  .feed-photos.two { grid-template-columns: 1fr 1fr; }
  .feed-photos.three-plus { grid-template-columns: 1fr 1fr; }
  .feed-photos img {
    width: 100%;
    height: 160px;
    object-fit: cover;
    cursor: pointer;
  }
  .feed-photos.one img {
    height: auto !important;
    max-height: 400px;
    object-fit: contain !important;
    background: #F2F3EE;
    border-radius: 4px;
  }

  /* 하자 탭 */
  .defect-section {
    padding: 10px 12px;
  }
  .defect-group-title {
    font-size: 13px;
    font-weight: 700;
    color: #E65100;
    padding: 12px 0 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .defect-card {
    background: #FFF8E1;
    border: 1px solid #FFD54F;
    border-radius: 12px;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .defect-photos {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px;
  }
  .defect-photos img {
    width: 100%;
    height: 140px;
    object-fit: cover;
    cursor: pointer;
  }
  .defect-photos img:only-child {
    grid-column: 1 / -1;
    height: 180px;
  }
  .defect-info {
    padding: 10px 12px;
  }
  .defect-location {
    font-size: 13px;
    font-weight: 700;
    color: #E65100;
  }
  .defect-desc {
    font-size: 12px;
    color: #64748b;
    margin-top: 2px;
  }

  /* 빈 상태 */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: #94a3b8;
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 8px; }
  .empty-state .text { font-size: 14px; }

  /* 전체화면 뷰어 */
  .photo-viewer {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.95);
    z-index: 1000;
    flex-direction: column;
  }
  .photo-viewer.active { display: flex; }
  .viewer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    color: white;
  }
  .viewer-close {
    font-size: 24px;
    cursor: pointer;
    padding: 4px;
  }
  .viewer-counter { font-size: 13px; opacity: 0.7; }
  .viewer-body {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .viewer-body img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .viewer-footer {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 12px 16px calc(24px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    align-items: center;
    background: linear-gradient(to top, rgba(0,0,0,0.95), rgba(0,0,0,0));
    z-index: 2;
  }
  .viewer-download {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.15);
    border: none;
    cursor: pointer;
    padding: 10px 20px;
    border-radius: 24px;
    transition: background 0.2s;
    color: white;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
  }
  .viewer-download:active {
    background: rgba(255,255,255,0.3);
  }
  .viewer-download svg {
    width: 18px;
    height: 18px;
    stroke: white;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .viewer-toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(0,0,0,0.75);
    color: white;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    transition: all 0.3s ease;
    z-index: 1100;
    pointer-events: none;
  }
  .viewer-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* 로딩 */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    flex-direction: column;
    gap: 12px;
    color: #94a3b8;
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #E5E5DC;
    border-top-color: #4A7C59;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* PDF 저장 버튼 */
  .pdf-save-bar {
    padding: 16px 12px 24px;
    text-align: center;
  }
  .pdf-save-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #1E293B;
    color: white;
    border: none;
    padding: 14px 32px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.2s;
  }
  .pdf-save-btn:active { opacity: 0.8; }

  /* 소개하기 */
  .share-bar {
    padding: 12px 12px 32px;
    text-align: center;
  }
  .share-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: white;
    color: #1a1a1a;
    border: 1.5px solid #E5E5DC;
    padding: 12px 28px;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: -0.3px;
  }
  .share-btn:active { background: #f5f5f0; }

  /* 프린트용 CSS */
  @media print {
    body { background: white !important; max-width: 100%; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .header { position: static; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .main-tabs { display: none !important; }
    .pdf-save-bar { display: none !important; }
    .photo-viewer { display: none !important; }
    #statusTab { display: none !important; }
    #defectsTab { display: block !important; }
    .defect-card { break-inside: avoid; margin-bottom: 10px !important; }
    .defect-photos { grid-template-columns: 1fr 1fr !important; gap: 4px !important; }
    .defect-photos img { height: 120px !important; max-height: 120px; object-fit: cover !important; background: #f5f5f0; border-radius: 6px; }
    .defect-group-title { break-after: avoid; }
    .live-badge { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .progress-bar-bg, .progress-bar-fill { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .defect-card, .defect-info, .defect-group-title { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<div id="app">
  <div class="loading">
    <div class="spinner"></div>
    <div>리포트를 불러오는 중...</div>
  </div>
</div>

<!-- 사진 뷰어 -->
<div class="photo-viewer" id="photoViewer">
  <div class="viewer-header">
    <div class="viewer-close" onclick="closeViewer()">✕</div>
    <div class="viewer-counter" id="viewerCounter"></div>
    <div style="width:28px"></div>
  </div>
  <div class="viewer-body" id="viewerBody"
    ontouchstart="handleTouchStart(event)"
    ontouchmove="handleTouchMove(event)"
    ontouchend="handleTouchEnd(event)">
  </div>
  <div class="viewer-footer">
    <button class="viewer-download" onclick="downloadPhoto()" aria-label="저장">
      <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-5-5m5 5l5-5M5 21h14"/></svg>
      <span id="viewerDownloadLabel">저장</span>
    </button>
    <div style="color:rgba(255,255,255,0.5);font-size:11px;margin-top:8px">사진은 길게 눌러도 저장 가능</div>
  </div>
</div>
<div class="viewer-toast" id="viewerToast">저장되었습니다</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ===== 설정 =====
const SUPABASE_URL = 'https://iucicugxihxilcqtzrbk.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1Y2ljdWd4aWh4aWxjcXR6cmJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA2OTc0ODAsImV4cCI6MjA4NjI3MzQ4MH0.5_7_vNc7x2kU68ynssGhf2jPCevkE-OMfSfgmyrkZDA';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const CATEGORIES = [
  { key: '현관', icon: '🚪' },
  { key: '거실', icon: '🛋️' },
  { key: '주방', icon: '🍳' },
  { key: '화장실', icon: '🚿' },
  { key: '안방', icon: '🛏️' },
  { key: '안방 화장실', icon: '🚿' },
  { key: '방1', icon: '🛏️' },
  { key: '방2', icon: '🛏️' },
  { key: '방3', icon: '🛏️' },
  { key: '드레스룸', icon: '👔' },
  { key: '다용도실', icon: '🧹' },
  { key: '베란다', icon: '🌿' },
  { key: '안방 베란다', icon: '🌿' },
  { key: '팬트리', icon: '🗄️' },
];

let reportData = null;
let companyData = null;
let entries = [];
let defects = [];
let currentTab = 'status'; // status | defects
let categoriesWithData = [];

// ===== 초기화 =====
async function init() {
  const params = new URLSearchParams(window.location.search);
  const reportId = params.get('id');

  if (!reportId) {
    document.getElementById('app').innerHTML = `
      <div class="empty-state" style="margin-top:100px">
        <div class="icon">❌</div>
        <div class="text">유효하지 않은 링크입니다</div>
      </div>`;
    return;
  }

  try {
    // 리포트 기본 정보 (bookings → customers, companies 조인)
    const { data: report } = await sb
      .from('cleaning_reports')
      .select('*, bookings(*, customers(name), companies(name, logo_url))')
      .eq('id', reportId)
      .single();

    if (!report) {
      document.getElementById('app').innerHTML = `
        <div class="empty-state" style="margin-top:100px">
          <div class="icon" style="font-size:48px;margin-bottom:16px">📋</div>
          <div class="text" style="font-size:16px;font-weight:600;margin-bottom:8px">보관 기간이 만료되었습니다</div>
          <div class="text" style="font-size:13px;color:#94a3b8">리포트는 생성일로부터 6개월간 보관됩니다</div>
        </div>`;
      return;
    }
    reportData = report;
    companyData = report.bookings?.companies || null;

    // 엔트리 + 사진
    const { data: entryData } = await sb
      .from('report_entries')
      .select('*, report_photos(*)')
      .eq('report_id', reportId)
      .order('created_at', { ascending: false });

    entries = entryData || [];

    // 하자
    const { data: defectData } = await sb
      .from('report_defects')
      .select()
      .eq('report_id', reportId)
      .order('created_at', { ascending: false });

    defects = defectData || [];

    // 하자에 entry 사진 연결
    for (const d of defects) {
      if (d.entry_id) {
        const { data: photos } = await sb
          .from('report_photos')
          .select()
          .eq('entry_id', d.entry_id)
          .order('sort_order');
        d.all_photos = photos || [];
      } else {
        d.all_photos = d.photo_url ? [{ photo_url: d.photo_url }] : [];
      }
    }

    render();
    setupRealtime(reportId);

    // Safari에서 print 파라미터로 열렸으면 자동 PDF 실행
    if (params.get('print') === '1') {
      currentTab = 'defects';
      render();
      const images = document.querySelectorAll('#defectsTab img[loading="lazy"]');
      images.forEach(img => img.removeAttribute('loading'));
      const allLoaded = Array.from(images).map(img => {
        if (img.complete) return Promise.resolve();
        return new Promise(resolve => { img.onload = resolve; img.onerror = resolve; });
      });
      Promise.all(allLoaded).then(() => setTimeout(() => window.print(), 500));
    }
  } catch (e) {
    document.getElementById('app').innerHTML = `
      <div class="empty-state" style="margin-top:100px">
        <div class="icon">😢</div>
        <div class="text">${e.message}</div>
      </div>`;
  }
}

// ===== 실시간 업데이트 =====
function setupRealtime(reportId) {
  sb.channel('report-' + reportId)
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'cleaning_reports', filter: `id=eq.${reportId}` },
      () => refreshData(reportId))
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'report_entries', filter: `report_id=eq.${reportId}` },
      () => refreshData(reportId))
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'report_photos', filter: `report_id=eq.${reportId}` },
      () => refreshData(reportId))
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'report_defects', filter: `report_id=eq.${reportId}` },
      () => refreshData(reportId))
    .subscribe();
}

async function refreshData(reportId) {
  // 리포트 기본 정보 갱신 (구역 순서/아이콘/숨김 등)
  const { data: freshReport } = await sb
    .from('cleaning_reports')
    .select('*, bookings(*, customers(name), companies(name, logo_url))')
    .eq('id', reportId)
    .single();
  if (freshReport) {
    reportData = freshReport;
    companyData = freshReport.bookings?.companies || null;
  }

  const { data: entryData } = await sb
    .from('report_entries')
    .select('*, report_photos(*)')
    .eq('report_id', reportId)
    .order('created_at', { ascending: false });
  entries = entryData || [];

  const { data: defectData } = await sb
    .from('report_defects')
    .select()
    .eq('report_id', reportId)
    .order('created_at', { ascending: false });
  defects = defectData || [];

  for (const d of defects) {
    if (d.entry_id) {
      const { data: photos } = await sb
        .from('report_photos')
        .select()
        .eq('entry_id', d.entry_id)
        .order('sort_order');
      d.all_photos = photos || [];
    } else {
      d.all_photos = d.photo_url ? [{ photo_url: d.photo_url }] : [];
    }
  }

  render();
}

// ===== 렌더링 =====
function render() {
  const booking = reportData.bookings;
  const customer = booking;
  const isCompleted = reportData.status === 'completed';

  // 회사 로고 HTML
  const logoHtml = companyData?.logo_url
    ? `<img class="company-logo" src="${companyData.logo_url}" alt="logo">`
    : '';
  const companyName = companyData?.name || '청소 리포트';
  const contactPhone = reportData.contact_phone || '';

  // 숨긴 구역 필터링
  const hiddenSet = new Set(reportData.hidden_categories || []);
  const visibleCategories = CATEGORIES.filter(c => !hiddenSet.has(c.key));

  // 커스텀 구역 자동 감지 + 아이콘 맵
  const categoryIcons = reportData.category_icons || {};
  const categoryOrder = reportData.category_order || [];
  const defaultKeys = new Set(CATEGORIES.map(c => c.key));
  const customCats = [];
  // entries에서 커스텀 구역 감지
  for (const e of entries) {
    if (!defaultKeys.has(e.category) && !hiddenSet.has(e.category) && !customCats.find(c => c.key === e.category)) {
      customCats.push({ key: e.category, icon: categoryIcons[e.category] || '📁' });
    }
  }
  // category_order에 있지만 entries에 없는 커스텀 구역도 추가
  for (const key of categoryOrder) {
    if (!defaultKeys.has(key) && !hiddenSet.has(key) && !customCats.find(c => c.key === key)) {
      customCats.push({ key: key, icon: categoryIcons[key] || '📁' });
    }
  }
  // 기본 구역도 아이콘 오버라이드 적용
  visibleCategories.forEach(c => {
    if (categoryIcons[c.key]) c.icon = categoryIcons[c.key];
  });
  let allCategories = [...visibleCategories, ...customCats];

  // 저장된 순서 적용
  if (categoryOrder.length > 0) {
    const ordered = [];
    for (const key of categoryOrder) {
      const cat = allCategories.find(c => c.key === key);
      if (cat) ordered.push(cat);
    }
    for (const cat of allCategories) {
      if (!ordered.find(c => c.key === cat.key)) ordered.push(cat);
    }
    allCategories = ordered;
  }

  categoriesWithData = allCategories.map(cat => {
    const catEntries = entries.filter(e => e.category === cat.key);
    const beforeEntries = catEntries.filter(e => e.photo_type === 'before');
    const afterEntries = catEntries.filter(e => e.photo_type === 'after');
    const beforeCount = beforeEntries.reduce((s, e) => s + (e.report_photos?.length || 0), 0);
    const afterCount = afterEntries.reduce((s, e) => s + (e.report_photos?.length || 0), 0);
    const totalCount = beforeCount + afterCount;

    let status = 'waiting';
    if (afterCount > 0) status = 'done';
    else if (beforeCount > 0) status = 'progress';

    return { ...cat, beforeEntries, afterEntries, beforeCount, afterCount, totalCount, status };
  });

  const activeCats = categoriesWithData.filter(c => c.totalCount > 0);
  const totalPhotos = categoriesWithData.reduce((s, c) => s + c.totalCount, 0);
  const doneCats = categoriesWithData.filter(c => c.status === 'done').length;
  const progress = activeCats.length > 0 ? Math.round((doneCats / activeCats.length) * 100) : 0;

  document.getElementById('app').innerHTML = `
    <!-- 헤더 -->
    <div class="header" style="position:static">
      <div style="margin-bottom:16px">
        <span style="display:inline-block;padding:4px 12px;border:1.5px solid rgba(255,255,255,0.25);border-radius:10px;font-size:10px;font-weight:600;color:rgba(255,255,255,0.6);letter-spacing:0.5px">✨ 프리미엄 청소 리포트</span>
      </div>
      <div class="header-top">
        <div class="company-info">
          ${logoHtml ? `<img class="company-logo" src="${companyData.logo_url}" alt="logo" style="width:40px;height:40px;border-radius:10px">` : ''}
          <div>
            <div class="company-name" style="font-size:17px">${companyName}${contactPhone ? `<a href="tel:${contactPhone}" class="company-call">문의</a>` : ''}</div>
          </div>
        </div>
        <div style="text-align:right">
          ${isCompleted
            ? `<div class="live-badge completed-badge" style="display:inline-flex">✓ 완료</div>`
            : `<div style="display:inline-flex;align-items:center;gap:5px">
                <div style="position:relative;width:7px;height:7px">
                  <div style="position:absolute;inset:0;background:#4A9D5B;border-radius:50%"></div>
                  <div style="position:absolute;inset:-3px;border:2px solid #4A9D5B;border-radius:50%;animation:pulse-ring 1.5s infinite;opacity:0"></div>
                </div>
                <span style="font-size:10px;font-weight:600;color:#4A9D5B">현재 청소중</span>
              </div>`}
          ${!isCompleted ? `<div style="font-size:10px;color:rgba(255,255,255,0.3);margin-top:2px">실시간으로 업데이트됩니다</div>` : ''}
          <div style="font-size:11px;color:rgba(255,255,255,0.35);margin-top:4px">${booking?.scheduled_date || ''}</div>
        </div>
      </div>
      <div style="margin-top:10px;font-size:12px;color:rgba(255,255,255,0.5)">
        ${(new URLSearchParams(location.search).get('public') === '1')
          ? `<span>${(booking?.customer_name || booking?.customers?.name || '고객').charAt(0)}*님</span>`
          : `<span onclick="var f=this.parentNode.querySelector('.customer-full');var m=this.parentNode.querySelector('.customer-masked');if(f.style.display==='none'){f.style.display='inline';m.style.display='none'}else{f.style.display='none';m.style.display='inline'}" style="cursor:pointer">
              <span class="customer-masked">${(booking?.customer_name || booking?.customers?.name || '고객').charAt(0)}*님 ▸</span>
              <span class="customer-full" style="display:none;color:rgba(255,255,255,0.85);font-weight:600">${booking?.customer_name || booking?.customers?.name || '고객'}님 ◂</span>
            </span>`}
        ${reportData?.customer_phone_tail ? `<span style="margin-left:6px">010-****-**${reportData.customer_phone_tail}</span>` : ''}
      </div>
    </div>

    <!-- 메인 탭 -->
    <div class="main-tabs">
      <div class="main-tab ${currentTab === 'status' ? 'active' : ''}" onclick="switchTab('status')">
        청소 현황
      </div>
      <div class="main-tab ${currentTab === 'defects' ? 'active' : ''}" onclick="switchTab('defects')">
        하자 체크 <span class="tab-count defect-count">${defects.length}</span>
      </div>
    </div>

    <!-- 청소 현황 탭 -->
    <div class="tab-content ${currentTab === 'status' ? 'active' : ''}" id="statusTab">
      <div class="accordion-list">
        ${categoriesWithData.map((cat, i) => renderAccordion(cat, i)).join('')}
      </div>
    </div>

    <!-- 하자 체크 탭 -->
    <div class="tab-content ${currentTab === 'defects' ? 'active' : ''}" id="defectsTab">
      ${renderDefectsTab()}
      ${defects.length > 0 ? `
        <div class="pdf-save-bar">
          <button class="pdf-save-btn" onclick="savePdf()">
            📄 하자 리포트 PDF 저장
          </button>
        </div>
      ` : ''}
    </div>

    <!-- 소개하기 -->
    ${totalPhotos > 0 ? `
      <div class="share-bar">
        <div style="text-align:center;font-size:14px;font-weight:600;color:#1a1a1a;margin-bottom:10px">✨ 청소가 마음에 드셨나요?</div>
        <button class="share-btn" onclick="shareReportLink()">
          🔗 지인에게 소개하기
        </button>
        <div style="text-align:center;font-size:11px;color:#94a3b8;margin-top:12px;line-height:1.6">사진은 꾹 눌러 저장, 리포트 화면은 캡쳐하여<br>후기에 활용해주시면 사장님에게 큰 힘이 됩니다</div>
        <div style="text-align:right;font-size:9px;color:#c4c4c4;margin-top:8px;padding-right:4px">Powered by 클리닝매니저</div>
      </div>
    ` : ''}
  `;
}

function renderAccordion(cat, index) {
  const statusClass = cat.status === 'done' ? 'status-done' :
                       cat.status === 'progress' ? 'status-progress' : 'status-waiting';
  const statusText = cat.status === 'done' ? '✓ 완료' :
                     cat.status === 'progress' ? '진행중' : '대기';

  if (cat.totalCount === 0) {
    return `
      <div class="accordion-item">
        <div class="accordion-header" style="opacity:0.5">
          <span class="accordion-icon">${cat.icon}</span>
          <span class="accordion-title">${cat.key}</span>
          <span class="accordion-status ${statusClass}">${statusText}</span>
        </div>
      </div>`;
  }

  return `
    <div class="accordion-item" id="acc-${index}">
      <div class="accordion-header" onclick="toggleAccordion(${index})">
        <span class="accordion-icon">${cat.icon}</span>
        <span class="accordion-title">${cat.key}</span>
        <span class="accordion-count">${cat.totalCount}장</span>
        <span class="accordion-status ${statusClass}">${statusText}</span>
        <span class="accordion-arrow">▼</span>
      </div>
      <div class="accordion-body">
        <div class="sub-tabs">
          <div class="sub-tab ${cat.status !== 'done' ? 'active' : ''}" id="sub-before-${index}" onclick="switchSubTab(${index}, 'before')">
            청소 전 <span class="count before">${cat.beforeCount}</span>
          </div>
          <div class="sub-tab ${cat.status === 'done' ? 'after-active' : ''}" id="sub-after-${index}" onclick="switchSubTab(${index}, 'after')">
            청소 후 <span class="count after">${cat.afterCount}</span>
          </div>
        </div>
        <div class="sub-content ${cat.status !== 'done' ? 'active' : ''}" id="sub-content-before-${index}">
          ${cat.beforeEntries.length > 0
            ? cat.beforeEntries.map(e => renderFeedCard(e, 'before')).join('')
            : '<div class="empty-state"><div class="icon">📷</div><div class="text">아직 사진이 없습니다</div></div>'}
        </div>
        <div class="sub-content ${cat.status === 'done' ? 'active' : ''}" id="sub-content-after-${index}">
          ${cat.afterEntries.length > 0
            ? cat.afterEntries.map(e => renderFeedCard(e, 'after')).join('')
            : '<div class="empty-state"><div class="icon">✨</div><div class="text">아직 사진이 없습니다</div></div>'}
        </div>
      </div>
    </div>`;
}

function isVideoUrl(url) {
  const lower = (url || '').toLowerCase();
  return lower.includes('.mp4') || lower.includes('.mov') || lower.includes('.avi');
}

function renderMediaThumb(photo, photoUrls, videoUrlMap, index, isLast, remaining) {
  const url = photo.photo_url;
  const hasVideo = !!photo.video_url || isVideoUrl(url);
  const jsonUrls = JSON.stringify(photoUrls).replace(/"/g, '&quot;');
  const jsonVids = JSON.stringify(videoUrlMap).replace(/"/g, '&quot;');
  const onclick = `openViewer(${jsonUrls}, ${index}, ${jsonVids})`;

  if (hasVideo) {
    return `<div style="position:relative;cursor:pointer;background:#1a1a1a;min-height:120px;display:flex;align-items:center;justify-content:center" onclick="${onclick}">
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <div style="background:rgba(255,255,255,0.15);border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center">
          <div style="color:white;font-size:20px;margin-left:2px">▶</div>
        </div>
        <div style="color:rgba(255,255,255,0.5);font-size:11px">영상</div>
      </div>
      ${isLast ? `<div style="position:absolute;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;color:white;font-size:20px;font-weight:700">+${remaining}</div>` : ''}
    </div>`;
  }
  if (isLast) {
    return `<div style="position:relative;cursor:pointer" onclick="${onclick}">
      <img src="${url}" loading="lazy" style="pointer-events:none">
      <div style="position:absolute;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;color:white;font-size:20px;font-weight:700">+${remaining}</div>
    </div>`;
  }
  return `<img src="${url}" onclick="${onclick}" loading="lazy">`;
}

function renderFeedCard(entry, type) {
  const photos = entry.report_photos || [];
  const isDefect = entry.is_defect === true;
  const time = entry.created_at ? new Date(entry.created_at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) : '';
  const photoUrls = photos.map(p => p.photo_url);
  const videoUrlMap = photos.map(p => p.video_url || null);

  const gridClass = photos.length === 1 ? 'one' : photos.length === 2 ? 'two' : 'three-plus';
  const displayPhotos = photos.slice(0, 4);
  const remaining = photos.length - 4;

  return `
    <div class="feed-card ${isDefect ? 'defect' : ''}">
      <div class="feed-header">
        ${isDefect
          ? '<span style="font-size:12px">⚠️</span><span class="defect-label">하자</span>'
          : `<div class="feed-dot ${type}"></div>`}
        <span class="feed-time">${time}</span>
      </div>
      ${entry.memo ? `<div class="${isDefect ? 'feed-memo defect-memo' : 'feed-memo'}">${entry.memo}</div>` : ''}
      ${photos.length > 0 ? `
        <div class="feed-photos ${gridClass}">
          ${displayPhotos.map((p, i) => renderMediaThumb(p, photoUrls, videoUrlMap, i, i === 3 && remaining > 0, remaining)).join('')}
        </div>
      ` : ''}
    </div>`;
}

function renderDefectsTab() {
  if (defects.length === 0) {
    return `
      <div class="empty-state" style="margin-top:40px">
        <div style="width:48px;height:48px;border-radius:50%;background:rgba(74,157,91,0.08);display:flex;align-items:center;justify-content:center;margin:0 auto 12px">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A9D5B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <div class="text">발견된 하자가 없습니다</div>
      </div>`;
  }

  // 구역별 그룹핑
  const grouped = {};
  for (const d of defects) {
    const cat = d.category || d.location || '기타';
    if (!grouped[cat]) grouped[cat] = [];
    grouped[cat].push(d);
  }

  let html = '<div class="defect-section">';

  for (const [category, items] of Object.entries(grouped)) {
    const catInfo = CATEGORIES.find(c => c.key === category);
    const icon = catInfo ? catInfo.icon : '📁';

    html += `
      <div class="defect-group-title">
        <span>${icon}</span>
        <span>${category}</span>
        <span style="font-size:11px;color:#94a3b8;font-weight:400">${items.length}건</span>
      </div>`;

    for (const d of items) {
      const photoUrls = d.all_photos.map(p => p.photo_url);

      html += `
        <div class="defect-card">
          ${photoUrls.length > 0 ? `
            <div class="defect-photos">
              ${photoUrls.map((url, i) => `
                <img src="${url}" onclick="openViewer(${JSON.stringify(photoUrls).replace(/"/g, '&quot;')}, ${i})" loading="lazy">
              `).join('')}
            </div>
          ` : ''}
          <div class="defect-info">
            <div class="defect-location">⚠️ ${d.location || category}${photoUrls.length > 1 ? ` · ${photoUrls.length}장` : ''}</div>
            ${d.description ? `<div class="defect-desc">${d.description}</div>` : ''}
          </div>
        </div>`;
    }
  }

  html += '</div>';
  return html;
}

// ===== 인터랙션 =====
function switchTab(tab) {
  currentTab = tab;
  render();
  pushState();
}

function toggleAccordion(index) {
  const el = document.getElementById('acc-' + index);
  if (!el) return;
  const wasOpen = el.classList.contains('open');
  el.classList.toggle('open');
  if (!wasOpen) pushState();
}

function switchSubTab(index, type) {
  const beforeTab = document.getElementById('sub-before-' + index);
  const afterTab = document.getElementById('sub-after-' + index);
  const beforeContent = document.getElementById('sub-content-before-' + index);
  const afterContent = document.getElementById('sub-content-after-' + index);

  if (type === 'before') {
    beforeTab.className = 'sub-tab active';
    afterTab.className = 'sub-tab';
    beforeContent.className = 'sub-content active';
    afterContent.className = 'sub-content';
  } else {
    beforeTab.className = 'sub-tab';
    afterTab.className = 'sub-tab after-active';
    beforeContent.className = 'sub-content';
    afterContent.className = 'sub-content active';
  }
}

// ===== PDF 저장 =====
function savePdf() {
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const isInApp = /KAKAOTALK|NAVER|Line|Instagram|FBAN|FBAV/i.test(navigator.userAgent);

  // iOS 인앱 브라우저: 링크 복사 + 안내
  if (isIOS && isInApp) {
    navigator.clipboard.writeText(window.location.href).catch(() => {});
    alert('카카오톡 등 인앱 브라우저에서는\nPDF 저장이 지원되지 않습니다.\n\n링크가 복사되었습니다.\nSafari에서 해당 링크를 열어\nPDF를 다운받아주세요.');
    return;
  }

  // 하자 탭으로 전환
  if (currentTab !== 'defects') {
    currentTab = 'defects';
    render();
  }

  // lazy 이미지 모두 프리로드 후 인쇄
  const images = document.querySelectorAll('#defectsTab img[loading="lazy"]');
  images.forEach(img => img.removeAttribute('loading'));

  const allLoaded = Array.from(images).map(img => {
    if (img.complete) return Promise.resolve();
    return new Promise(resolve => {
      img.onload = resolve;
      img.onerror = resolve;
    });
  });

  Promise.all(allLoaded).then(() => {
    setTimeout(() => window.print(), 200);
  });
}

// ===== 사진 뷰어 =====
let viewerPhotos = [];
let viewerVideoUrls = [];
let viewerIndex = 0;
let touchStartX = 0;

function openViewer(urls, index, videoUrls) {
  viewerPhotos = urls;
  viewerVideoUrls = videoUrls || [];
  viewerIndex = index;
  // 모든 사진 프리로드 (5장째부터 로딩 지연 방지)
  urls.forEach(url => { if (!isVideoUrl(url)) { const img = new Image(); img.src = url; } });
  updateViewer();
  document.getElementById('photoViewer').classList.add('active');
  document.body.style.overflow = 'hidden';
  pushState();
}

function closeViewer() {
  const video = document.querySelector('#viewerBody video');
  if (video) video.pause();
  document.getElementById('photoViewer').classList.remove('active');
  document.body.style.overflow = '';
}

function isInAppBrowser() {
  return /KAKAOTALK|NAVER|Line|Instagram|FBAN|FBAV/i.test(navigator.userAgent);
}

function updateViewer() {
  document.getElementById('viewerCounter').textContent =
    `${viewerIndex + 1} / ${viewerPhotos.length}`;
  const videoUrl = viewerVideoUrls[viewerIndex];
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  if (videoUrl) {
    document.getElementById('viewerBody').innerHTML =
      `<video src="${videoUrl}" controls playsinline preload="metadata" style="max-width:100%;max-height:80vh"></video>`;
  } else {
    document.getElementById('viewerBody').innerHTML =
      `<img src="${viewerPhotos[viewerIndex]}" style="max-width:100%;max-height:100%;object-fit:contain;-webkit-touch-callout:default">`;
  }
  // 저장 버튼: iOS 영상일 때만 노출 (그 외엔 OS 기본 길게 누르기/3단 메뉴 사용)
  const showSave = !!videoUrl && isIOS;
  const footer = document.querySelector('.viewer-footer');
  const body = document.querySelector('.viewer-body');
  if (footer) footer.style.display = showSave ? 'flex' : 'none';
  if (body) body.style.paddingBottom = showSave ? '90px' : '0';
}

async function downloadPhoto() {
  const url = viewerVideoUrls[viewerIndex] || viewerPhotos[viewerIndex];
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const isVid = !!viewerVideoUrls[viewerIndex] || isVideoUrl(url);

  // 영상: Web Share API(files) 우선 — iOS 공유 시트로 "비디오 저장" 가능
  if (isVid) {
    try {
      showToast('영상 준비 중...');
      const res = await fetch(url);
      const blob = await res.blob();
      const fileName = 'cleanops_video_' + (viewerIndex + 1) + '.mp4';
      const file = new File([blob], fileName, { type: blob.type || 'video/mp4' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file] });
        return;
      }
      // fallback: blob download (Android Chrome 등)
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = fileName;
      a.click();
      URL.revokeObjectURL(a.href);
      showToast('저장되었습니다');
      return;
    } catch (e) {
      // share 거부(AbortError)는 무시, 그 외엔 새 창 fallback
      if (e && e.name === 'AbortError') return;
      window.open(url, '_blank');
      showToast('영상 재생 후 공유 → 비디오 저장 하세요');
      return;
    }
  }

  // 사진: 기존 흐름
  if (isIOS) {
    window.open(url, '_blank');
    showToast('사진을 길게 눌러 저장하세요');
    return;
  }
  if (isInAppBrowser()) {
    window.open(url, '_blank');
    showToast('사진을 길게 눌러 저장하세요');
    return;
  }
  try {
    const res = await fetch(url);
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'cleanops_photo_' + (viewerIndex + 1) + '.jpg';
    a.click();
    URL.revokeObjectURL(a.href);
    showToast('저장되었습니다');
  } catch (e) {
    window.open(url, '_blank');
  }
}

function showToast(msg) {
  const t = document.getElementById('viewerToast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

function handleTouchStart(e) {
  touchStartX = e.touches[0].clientX;
}
function handleTouchMove(e) {
  e.preventDefault();
}
function handleTouchEnd(e) {
  const diff = touchStartX - e.changedTouches[0].clientX;
  if (Math.abs(diff) > 50) {
    if (diff > 0 && viewerIndex < viewerPhotos.length - 1) {
      viewerIndex++;
      updateViewer();
    } else if (diff < 0 && viewerIndex > 0) {
      viewerIndex--;
      updateViewer();
    }
  }
}

// ===== 뒤로가기 처리 =====
function pushState() {
  history.pushState({ inApp: true }, '');
}

window.addEventListener('popstate', function(e) {
  // 1. 사진 뷰어가 열려있으면 닫기
  const viewer = document.getElementById('photoViewer');
  if (viewer && viewer.classList.contains('active')) {
    closeViewer();
    pushState();
    return;
  }

  // 2. 그 외: 아코디언 모두 접고 청소현황 탭으로
  const openAccs = document.querySelectorAll('.accordion-item.open');
  if (openAccs.length > 0 || currentTab !== 'status') {
    openAccs.forEach(el => el.classList.remove('open'));
    if (currentTab !== 'status') {
      currentTab = 'status';
      render();
    }
    pushState();
    return;
  }

  // 3. 이미 목록 상태면 페이지에서 나감 (기본 동작)
});

// iOS/인앱 브라우저 힌트는 isInAppBrowser()에서 처리

// 카톡 인앱 브라우저 힌트 표시
if (isInAppBrowser()) {
  const hint = document.getElementById('inAppHint');
  if (hint) hint.style.display = 'block';
}

function shareReportLink() {
  const url = window.location.href;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => {
      showToast('리포트가 복사되었습니다');
    });
  } else {
    showToast('링크 복사에 실패했습니다');
  }
}

// 시작
pushState(); // 초기 히스토리 쌓기
init();
</script>
