<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>잠시만요...</title>
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
  body {
    font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    color: #6B7280; background: #fff;
  }
  .msg { text-align: center; padding: 56px 24px; max-width: 460px; }
  .msg h1 { font-size: 19px; font-weight: 800; color: #111; letter-spacing: -0.03em; margin-bottom: 12px; }
  .msg p { font-size: 13.5px; line-height: 1.75; color: #6B675F; }
  .msg a { display: inline-block; margin-top: 22px; color: #1B2D4F; font-weight: 700; text-decoration: none; font-size: 13px; }
  .msg a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="msg" id="loading">
  <p style="font-size:13px;">잠시만 기다려주세요...</p>
</div>

<script>
(function() {
  const SB_URL = 'https://iucicugxihxilcqtzrbk.supabase.co';
  const SB_ANON = 'sb_publishable_-_GTb-cNnVnC1gcVHoKlWw_5FztAXMy';
  const TEMPLATE_PATH = '/saeroclean/';
  const TRIAL_DAYS = 30;

  const path = window.location.pathname || '';

  // ─── 1. /verify/CODE → 기존 라우팅 보존 ───
  const verifyMatch = path.match(/^\/verify\/([A-Z0-9]{3,8})\/?$/i);
  if (verifyMatch) {
    window.location.replace('/verify/?c=' + verifyMatch[1].toUpperCase());
    return;
  }

  // ─── 2. /profile/SLUG/ → 신규 신뢰 프로필 (NEW) ───
  const profileMatch = path.match(/^\/profile\/([a-z0-9-]{3,30})\/?$/);
  if (profileMatch) {
    handleProfile(profileMatch[1]);
    return;
  }

  // ─── 3. /SLUG/ → 기존 미니홈피 (saeroclean 디자인, 호환 유지) ───
  const slugMatch = path.match(/^\/([a-z0-9-]{3,30})\/?$/);
  if (slugMatch) {
    handleSlug(slugMatch[1]);
    return;
  }

  // ─── 4. 진짜 404 ───
  goHome();

  // ━━━━━━━━━━━━ 신규 신뢰 프로필 (NEW) ━━━━━━━━━━━━
  async function handleProfile(slug) {
    try {
      const qs = new URLSearchParams({
        slug: 'eq.' + slug,
        is_published: 'eq.true',
        select: '*,company:companies(id,name,owner_name,business_number,is_paid,logo_url)'
      }).toString();
      const resp = await fetch(SB_URL + '/rest/v1/company_homepages?' + qs, {
        cache: 'no-store',
        headers: {
          'apikey': SB_ANON,
          'Authorization': 'Bearer ' + SB_ANON,
          'Accept': 'application/json'
        }
      });
      if (!resp.ok) { showNotFound(); return; }
      const rows = await resp.json();
      if (!rows.length) { showNotFound(); return; }

      const row = rows[0];
      const company = row.company || {};

      // 체험 만료 체크
      if (!company.is_paid && row.created_at) {
        const created = new Date(row.created_at).getTime();
        const days = (Date.now() - created) / 86400000;
        if (days > TRIAL_DAYS) { showExpired(company.name); return; }
      }

      await renderProfile(row, company);
    } catch (e) {
      console.error('profile render error:', e);
      showNotFound();
    }
  }

  async function renderProfile(row, company) {
    const resp = await fetch('/profile/index.html?t=' + Date.now(),
        { cache: 'no-store' });
    if (!resp.ok) { showNotFound(); return; }
    const html = await resp.text();
    const doc = new DOMParser().parseFromString(html, 'text/html');

    // 상대경로 → /profile/...
    doc.querySelectorAll('[src], [href]').forEach(function(el) {
      ['src', 'href'].forEach(function(attr) {
        const v = el.getAttribute(attr);
        if (!v) return;
        if (/^(https?:|data:|javascript:|mailto:|tel:|#|\/)/i.test(v)) return;
        el.setAttribute(attr, '/profile/' + v);
      });
    });

    function escHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    // 회사명
    if (company.name) {
      const t = doc.querySelector('title');
      if (t) t.textContent = company.name + ' — 신뢰 프로필';
      doc.querySelectorAll('[data-company-name]').forEach(function(el) {
        el.textContent = company.name;
      });
    }

    // 히어로 서브 (사장님이 hero_sub 입력했으면 사용, 아니면 기본 유지)
    const heroSub = (row.hero_sub || '').trim();
    if (heroSub) {
      doc.querySelectorAll('[data-hero-sub]').forEach(function(el) {
        el.innerHTML = escHtml(heroSub).replace(/\n/g, '<br>');
      });
    }

    // 아바타 우선순위:
    // 1. companies.logo_url (사장님이 더보기 탭에서 업로드한 로고)
    // 2. company_homepages.hero_poster_url (히어로 포스터 사진)
    // 3. fallback 이모지 (그대로)
    const avatarSrc = (company.logo_url || row.hero_poster_url || '').trim();
    if (avatarSrc) {
      doc.querySelectorAll('.avatar').forEach(function(el) {
        const fb = el.querySelector('[data-avatar-fallback]');
        if (fb) fb.remove();
        const img = doc.createElement('img');
        img.src = avatarSrc;
        img.alt = company.name || '';
        el.insertBefore(img, el.firstChild);
      });
    }

    // ─── 통계 + 후기 자동 채우기 (Phase 1.1) ───
    try {
      // 1) 통계 RPC 호출
      const statsResp = await fetch(SB_URL + '/rest/v1/rpc/public_profile_stats', {
        method: 'POST',
        cache: 'no-store',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SB_ANON,
          'Authorization': 'Bearer ' + SB_ANON
        },
        body: JSON.stringify({ profile_slug: row.slug })
      });
      if (statsResp.ok) {
        const stats = await statsResp.json();
        if (stats && typeof stats === 'object') {
          const fmt = function(n) { return n == null ? '0' : String(n); };
          const rating = stats.avg_rating == null
              ? '—'
              : Number(stats.avg_rating).toFixed(1);
          doc.querySelectorAll('[data-jobs-count]').forEach(function(el) {
            el.textContent = fmt(stats.reports_count);
          });
          doc.querySelectorAll('[data-review-count]').forEach(function(el) {
            el.textContent = fmt(stats.reviews_count);
          });
          doc.querySelectorAll('[data-review-count2]').forEach(function(el) {
            el.textContent = fmt(stats.reviews_count);
          });
          doc.querySelectorAll('[data-rating]').forEach(function(el) {
            el.textContent = rating;
          });
          doc.querySelectorAll('[data-last-work]').forEach(function(el) {
            el.textContent = formatRelativeDate(stats.last_report_at);
          });
        }
      }
      // 사업자 인증: 현재 Pro 회원이면 '완료', 아니면 '—'
      doc.querySelectorAll('[data-verified-label]').forEach(function(el) {
        el.textContent = company.is_paid ? '완료' : '—';
      });

      // ─── 신뢰 배지 (활성/비활성 4종 모두 표시) ───
      const badgeStats = (typeof stats === 'object' && stats) ? stats : {};
      const last = badgeStats.last_report_at
          ? new Date(badgeStats.last_report_at).getTime() : 0;
      const daysSinceLast = last ? (Date.now() - last) / 86400000 : Infinity;
      const reportsN = badgeStats.reports_count || 0;
      const reviewsN = badgeStats.reviews_count || 0;

      const badges = [
        {
          label: '최근 30일<br>작업 있음',
          svg: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 12 15 16 10"/>',
          active: daysSinceLast <= 30,
          criteriaActive: '최근 작업 확인됨',
          criteriaInactive: '30일 이내 작업 필요'
        },
        {
          label: '실제 리포트<br>공개',
          svg: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><polyline points="9 14 11 16 15 12"/>',
          active: reportsN > 0,
          criteriaActive: reportsN + '건 공개됨',
          criteriaInactive: '리포트 1건 이상 필요'
        },
        {
          label: '실제 후기<br>공개',
          svg: '<polygon points="12 2 15 8.5 22 9.3 17 14.1 18.2 21 12 17.8 5.8 21 7 14.1 2 9.3 9 8.5 12 2"/>',
          active: reviewsN > 0,
          criteriaActive: reviewsN + '개 공개됨',
          criteriaInactive: '후기 1건 이상 필요'
        },
        {
          label: '대표 직접<br>시공',
          svg: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
          active: true,
          criteriaActive: '플랫폼 검증',
          criteriaInactive: ''
        }
      ];

      const badgeListEl = doc.querySelector('[data-badges-list]');
      if (badgeListEl) {
        badgeListEl.innerHTML = '<div class="badge-list">' +
          badges.map(function(b) {
            const cls = b.active ? 'badge-card' : 'badge-card inactive';
            const criteria = b.active ? b.criteriaActive : b.criteriaInactive;
            return '<div class="' + cls + '">' +
              '<div class="badge-icon">' +
                '<svg viewBox="0 0 24 24">' + b.svg + '</svg>' +
              '</div>' +
              '<div class="badge-label">' + b.label + '</div>' +
              (criteria ? '<div class="badge-criteria">' + criteria + '</div>' : '') +
            '</div>';
          }).join('') +
          '</div>';
      }

      // 2) 최근 작업 기록 6건 fetch (RPC)
      const rwResp = await fetch(SB_URL + '/rest/v1/rpc/public_profile_recent_work', {
        method: 'POST',
        cache: 'no-store',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SB_ANON,
          'Authorization': 'Bearer ' + SB_ANON
        },
        body: JSON.stringify({ profile_slug: row.slug, work_limit: 6 })
      });
      if (rwResp.ok) {
        const works = await rwResp.json();
        if (Array.isArray(works) && works.length > 0) {
          const listEl = doc.querySelector('[data-recent-work-list]');
          if (listEl) {
            listEl.innerHTML = '<div class="work-list">' +
              works.map(function(w) {
                const dt = new Date(w.date);
                const dateStr = (dt.getMonth() + 1) + '월 ' + dt.getDate() + '일';
                const region = escHtml(w.address_region || '—');
                const pyeong = w.size_pyeong != null ? w.size_pyeong : '—';
                const service = escHtml(w.service_type || '');
                const photoCount = w.photo_count || 0;
                const photoHtml = w.photo_url
                  ? '<img src="' + escHtml(w.photo_url) + '" alt="">'
                  : '<div class="work-photo-empty">📷</div>';
                return '<a class="work-card" href="/?id=' +
                  encodeURIComponent(w.report_id) + '&public=1">' +
                  '<div class="work-photo">' + photoHtml +
                    '<span class="work-date-badge">' + dateStr + '</span></div>' +
                  '<div class="work-meta">' +
                    '<div class="work-region">' + region + '</div>' +
                    '<div class="work-spec">' + pyeong + '평 · ' + service + '</div>' +
                    '<div class="work-photo-count">사진 ' + photoCount + '장</div>' +
                    '<div class="work-report-btn">리포트 보기 ›</div>' +
                  '</div></a>';
              }).join('') +
              '</div>';
          }
        }
      }

      // 3) 최근 후기 3건 fetch (cert_code 포함 — 인증 카드용)
      const rvResp = await fetch(
        SB_URL + '/rest/v1/reviews?' + new URLSearchParams({
          company_id: 'eq.' + company.id,
          is_hidden: 'eq.false',
          select: 'rating,content,name_display,customer_name_snapshot,service_type_snapshot,created_at,cert_code',
          order: 'created_at.desc',
          limit: '3'
        }).toString(),
        {
          cache: 'no-store',
          headers: {
            'apikey': SB_ANON,
            'Authorization': 'Bearer ' + SB_ANON,
            'Accept': 'application/json'
          }
        }
      );
      if (rvResp.ok) {
        const reviews = await rvResp.json();
        if (Array.isArray(reviews) && reviews.length > 0) {
          const listEl = doc.querySelector('[data-reviews-list]');
          if (listEl) {
            listEl.innerHTML = '<div class="rev-list">' +
              reviews.map(function(r) {
                const rating = Number(r.rating || 0).toFixed(1);
                const ratingStars = '★'.repeat(Math.round(r.rating || 0)) +
                                   '☆'.repeat(5 - Math.round(r.rating || 0));
                const content = escHtml(r.content || '').replace(/\n/g, '<br>');
                const dt = new Date(r.created_at);
                const dateStr =
                  dt.getFullYear().toString().slice(2) + '.' +
                  String(dt.getMonth() + 1).padStart(2, '0') + '.' +
                  String(dt.getDate()).padStart(2, '0');
                const service = r.service_type_snapshot
                    ? ' · ' + escHtml(r.service_type_snapshot)
                    : '';
                const name = r.name_display === 'anonymous'
                    ? '익명'
                    : (r.customer_name_snapshot
                        ? escHtml(r.customer_name_snapshot.charAt(0)) + '*'
                        : '익명');
                const certCode = (r.cert_code || '').replace(/^#/, '');
                const verifyUrl = certCode
                    ? '/verify/' + encodeURIComponent(certCode)
                    : '';
                const qrTarget = certCode
                    ? 'https://cleaningmanager.kr/verify/' + certCode
                    : '';
                const qrImg = qrTarget
                    ? '<img class="rev-qr" alt="" src="https://api.qrserver.com/v1/create-qr-code/?size=80x80&margin=0&data=' +
                      encodeURIComponent(qrTarget) + '">'
                    : '';
                const verifyBlock = certCode
                    ? '<div class="rev-verify">' +
                        qrImg +
                        '<span class="rev-verify-text">' +
                          '<span class="rev-verify-label">✓ 검증</span>' +
                          '<span class="rev-cert-code">#' + escHtml(certCode) + '</span>' +
                        '</span>' +
                      '</div>'
                    : '';
                const cardOpen = certCode
                    ? '<a class="rev-card" href="' + verifyUrl + '" target="_blank" rel="noopener">'
                    : '<div class="rev-card">';
                const cardClose = certCode ? '</a>' : '</div>';
                return cardOpen +
                  '<div class="rev-header">' +
                    '<div class="rev-rating">' +
                      '<span class="rev-rating-stars">' + ratingStars + '</span> ' + rating +
                    '</div>' +
                    verifyBlock +
                  '</div>' +
                  '<p class="rev-content">' + content + '</p>' +
                  '<div class="rev-meta">' + name + service + ' · ' + dateStr + '</div>' +
                  cardClose;
              }).join('') +
              '</div>';
          }
        }
      }
    } catch (e) {
      console.error('profile stats/reviews fetch error:', e);
      // 실패해도 페이지 자체는 렌더 (placeholder 유지)
    }

    // 폼 모달·CTA에서 사용할 데이터 주입
    doc.body.setAttribute('data-company-id', company.id || '');
    doc.body.setAttribute('data-company-name', company.name || '');
    doc.body.setAttribute(
        'data-contact-phone', (row.contact_phone || '').trim());
    doc.body.setAttribute(
        'data-kakao-url', (row.kakao_channel_url || '').trim());

    // 카카오톡 상담 버튼 노출 (URL 있을 때만)
    if ((row.kakao_channel_url || '').trim()) {
      const wrap = doc.querySelector('[data-kakao-wrap]');
      if (wrap) wrap.setAttribute('style', '');
    }

    // 정보 카드: 영업시간 · 서비스 지역 · 사업자 정보 (컴팩트, 푸터 직전)
    const businessHours = (row.business_hours || '').trim();
    const serviceAreas = (row.service_areas || '').trim();
    const businessNumber = (company.business_number || '').trim();
    const ownerName = (company.owner_name || '').trim();
    if (businessHours || serviceAreas || businessNumber) {
      const wrap = doc.querySelector('[data-info-card-wrap]');
      if (wrap) {
        const rows = [];
        if (businessHours) {
          rows.push(
            '<div class="info-row">' +
              '<div class="info-icon">🕐</div>' +
              '<div class="info-value">' + escHtml(businessHours) + '</div>' +
            '</div>'
          );
        }
        if (serviceAreas) {
          rows.push(
            '<div class="info-row">' +
              '<div class="info-icon">📍</div>' +
              '<div class="info-value">' + escHtml(serviceAreas) + '</div>' +
            '</div>'
          );
        }
        if (businessNumber) {
          const ownerLine = ownerName ? ' · 대표 ' + escHtml(ownerName) : '';
          rows.push(
            '<div class="info-row">' +
              '<div class="info-icon">🏢</div>' +
              '<div class="info-value">' +
                escHtml(businessNumber) + ownerLine +
              '</div>' +
            '</div>'
          );
        }
        wrap.innerHTML = '<div class="info-card">' + rows.join('') + '</div>';
        wrap.setAttribute('style', '');
      }
    }

    // 문서 교체
    document.open();
    document.write('<!DOCTYPE html>' + doc.documentElement.outerHTML);
    document.close();
  }

  function formatRelativeDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    const diff = Math.floor((Date.now() - d.getTime()) / 86400000);
    if (diff < 1) return '오늘';
    if (diff === 1) return '1일 전';
    if (diff < 7) return diff + '일 전';
    if (diff < 30) return Math.floor(diff / 7) + '주 전';
    if (diff < 365) return Math.floor(diff / 30) + '개월 전';
    return Math.floor(diff / 365) + '년 전';
  }

  // ━━━━━━━━━━━━ 기존 saeroclean 라우팅 ━━━━━━━━━━━━

  async function handleSlug(slug) {
    try {
      const qs = new URLSearchParams({
        slug: 'eq.' + slug,
        is_published: 'eq.true',
        select: '*,company:companies(id,name,is_paid)'
      }).toString();
      const resp = await fetch(SB_URL + '/rest/v1/company_homepages?' + qs, {
        cache: 'no-store',
        headers: {
          'apikey': SB_ANON,
          'Authorization': 'Bearer ' + SB_ANON,
          'Accept': 'application/json'
        }
      });
      if (!resp.ok) { showNotFound(); return; }
      const rows = await resp.json();
      if (!rows.length) { showNotFound(); return; }

      const row = rows[0];
      const company = row.company || {};

      // 체험 만료 체크
      if (!company.is_paid && row.created_at) {
        const created = new Date(row.created_at).getTime();
        const days = (Date.now() - created) / 86400000;
        if (days > TRIAL_DAYS) { showExpired(company.name); return; }
      }

      await renderHomepage(row, company);
    } catch (e) {
      console.error('homepage render error:', e);
      showNotFound();
    }
  }

  async function renderHomepage(row, company) {
    // 캐시 우회 — saeroclean 템플릿이 업데이트되면 즉시 반영
    const resp = await fetch(
        TEMPLATE_PATH + 'index.html?t=' + Date.now(),
        { cache: 'no-store' });
    if (!resp.ok) { showNotFound(); return; }
    const html = await resp.text();
    const doc = new DOMParser().parseFromString(html, 'text/html');

    // 상대경로 → 절대경로(/saeroclean/...)
    doc.querySelectorAll('[src], [href]').forEach(function(el) {
      ['src', 'href'].forEach(function(attr) {
        const v = el.getAttribute(attr);
        if (!v) return;
        if (/^(https?:|data:|javascript:|mailto:|tel:|#|\/)/i.test(v)) return;
        el.setAttribute(attr, TEMPLATE_PATH + v);
      });
    });

    // 인라인 style의 url(...)도 동일하게 처리
    doc.querySelectorAll('[style]').forEach(function(el) {
      const s = el.getAttribute('style');
      if (s && /url\(/.test(s)) {
        el.setAttribute('style', s.replace(/url\(\s*(['"]?)(?!https?:|data:|\/)([^)'"]+)\1\s*\)/gi,
          function(_, q, p) { return 'url(' + q + TEMPLATE_PATH + p + q + ')'; }));
      }
    });

    // <style> 태그 내부 url() 처리 (hero_poster.jpg 등)
    doc.querySelectorAll('style').forEach(function(el) {
      el.textContent = el.textContent.replace(/url\(\s*(['"]?)(?!https?:|data:|\/)([^)'"]+)\1\s*\)/gi,
        function(_, q, p) { return 'url(' + q + TEMPLATE_PATH + p + q + ')'; });
    });

    // 데모 안내바 제거
    const demoBar = doc.querySelector('.demo-bar');
    if (demoBar) demoBar.remove();

    // 섹션 노출/숨김 (section_visibility)
    const vis = row.section_visibility || {};
    const sectionMap = {
      hero: '.hero',
      report: '#report',
      differentiators: '#diff',
      services: '#services',
      standards: '#standards',
      portfolio: '#portfolio',
      owner: '#owner'
    };
    Object.keys(sectionMap).forEach(function(key) {
      if (vis[key] === false) {
        const el = doc.querySelector(sectionMap[key]);
        if (el) el.remove();
      }
    });

    // 회사명 반영 — 타이틀 + 네비 브랜드 + 히어로 브랜드
    if (company.name) {
      const t = doc.querySelector('title');
      if (t) t.textContent = company.name;
      doc.querySelectorAll('.nav-brand, .hero-brand').forEach(function(el) {
        el.textContent = company.name;
      });
    }

    // ─── 히어로 텍스트/미디어 (DB 값이 있으면 덮어쓰기) ───
    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    if (row.hero_headline) {
      const h1 = doc.querySelector('.hero h1');
      if (h1) h1.innerHTML = esc(row.hero_headline).replace(/\n/g, '<br>');
    }
    if (row.hero_sub) {
      const sub = doc.querySelector('.hero-sub');
      if (sub) sub.innerHTML = esc(row.hero_sub).replace(/\n/g, '<br>');
    }
    // 사장님이 영상/포스터 중 하나라도 업로드했으면 saeroclean 기본 미디어는 완전 교체
    const hasCustomMedia = !!row.hero_video_url || !!row.hero_poster_url;
    if (hasCustomMedia) {
      const hero = doc.querySelector('.hero');
      const video = doc.querySelector('.hero video');

      if (row.hero_video_url) {
        // 영상 있음 → 사장님 영상 사용
        if (video) {
          video.querySelectorAll('source').forEach(function(s) { s.remove(); });
          video.setAttribute('src', row.hero_video_url);
          if (row.hero_poster_url) {
            video.setAttribute('poster', row.hero_poster_url);
          }
        }
      } else {
        // 영상 없고 포스터만 → video 요소 자체 제거 (기본 영상 안 보이게)
        if (video) video.remove();
      }

      // 배경 이미지: 사장님 포스터가 있으면 그것, 없으면 기본 saeroclean 포스터 제거(검정)
      if (hero) {
        const existing = hero.getAttribute('style') || '';
        if (row.hero_poster_url) {
          hero.setAttribute('style', existing +
            ";background-image:url('" + row.hero_poster_url +
            "');background-size:cover;background-position:center;background-repeat:no-repeat;");
        } else {
          // 영상만 있고 포스터 없음 → 기본 포스터 제거 (검정 배경에서 영상 로딩)
          hero.setAttribute('style', existing +
            ";background-image:none;background-color:#000;");
        }
      }
    }

    // ─── 이런 점이 다릅니다 (#diff 4 카드) ───
    if (row.differentiators && Array.isArray(row.differentiators)) {
      const diffCards = doc.querySelectorAll('#diff .diff');
      row.differentiators.forEach(function(item, i) {
        if (i >= diffCards.length || !item || typeof item !== 'object') return;
        const card = diffCards[i];
        const t = (item.title || '').trim();
        const d = (item.description || '').trim();
        if (t) {
          const h = card.querySelector('h3');
          if (h) h.innerHTML = esc(t).replace(/\n/g, '<br>');
        }
        if (d) {
          const p = card.querySelector('p');
          if (p) p.innerHTML = esc(d).replace(/\n/g, '<br>');
        }
      });
    }
    // 차별점 설명: 마침표 뒤 자동 줄바꿈 (사장님 콘텐츠 + saeroclean 기본 둘 다 적용)
    doc.querySelectorAll('#diff .diff p').forEach(function(p) {
      p.innerHTML = p.innerHTML.replace(/\.\s+/g, '.<br>');
    });

    // ─── 서비스 안내 (#services 3 카드) ───
    if (row.services && Array.isArray(row.services)) {
      const svcCards = doc.querySelectorAll('#services .service');
      row.services.forEach(function(item, i) {
        if (i >= svcCards.length || !item || typeof item !== 'object') return;
        const card = svcCards[i];
        const n = (item.name || '').trim();
        const t = (item.tag || '').trim();
        const inc = (item.included || '').trim();
        if (n) {
          const el = card.querySelector('.service-name');
          if (el) el.innerHTML = esc(n).replace(/\n/g, '<br>');
        }
        if (t) {
          const el = card.querySelector('.service-tag');
          if (el) el.innerHTML = esc(t).replace(/\n/g, '<br>');
        }
        if (inc) {
          const el = card.querySelector('.service-incl');
          if (el) el.innerHTML = esc(inc).replace(/\n/g, '<br>');
        }
      });
    }

    // (다음에 추가될 항목)
    // - standards_images[] → #standards 갤러리
    // - owner_photo_url, owner_quote, owner_bio
    // - booking modal의 company_id

    // 내부 #hash 앵커 클릭 시 페이지 이동 없이 스크롤
    const scrollScript = doc.createElement('script');
    scrollScript.textContent =
      "document.addEventListener('click', function(e) {" +
      "  var a = e.target.closest('a[href^=\"#\"]');" +
      "  if (!a) return;" +
      "  var id = a.getAttribute('href').slice(1);" +
      "  if (!id) return;" +
      "  var t = document.getElementById(id);" +
      "  if (t) { e.preventDefault(); t.scrollIntoView({behavior:'smooth'}); }" +
      "});";
    doc.body.appendChild(scrollScript);

    // 문서 교체 (URL은 그대로 /SLUG/ 유지)
    const finalHtml = '<!DOCTYPE html>' + doc.documentElement.outerHTML;
    document.open();
    document.write(finalHtml);
    document.close();
  }

  function showNotFound() {
    document.body.innerHTML =
      '<div class="msg">' +
      '<h1>페이지를 찾을 수 없어요</h1>' +
      '<p>주소가 정확한지 다시 확인해주세요.</p>' +
      '<a href="/">홈으로 이동</a>' +
      '</div>';
    document.title = '페이지 없음';
  }

  function showExpired(name) {
    document.body.innerHTML =
      '<div class="msg">' +
      '<h1>' + (name ? name + '의 ' : '') + '홈페이지가 잠시 비공개 상태예요</h1>' +
      '<p>업체 사장님께서 곧 정상화하실 예정입니다.<br>잠시 후 다시 방문해주세요.</p>' +
      '</div>';
    document.title = '일시 비공개';
  }

  function goHome() {
    window.location.replace('/');
  }
})();
</script>
</body>
</html>
