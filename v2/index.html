<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>청소 리포트</title>
<meta property="og:title" content="프리미엄 청소 리포트">
<meta property="og:description" content="실시간 청소 현황을 확인하세요">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #F2F3EE;
    color: #1a1a1a;
    max-width: 500px;
    margin: 0 auto;
    min-height: 100vh;
  }

  /* 헤더 */
  .header {
    background: #1E293B;
    color: white;
    padding: 12px 16px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .company-info {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .company-logo {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    object-fit: cover;
  }
  .company-name {
    font-size: 15px;
    font-weight: 700;
  }
  .live-badge {
    display: flex;
    align-items: center;
    gap: 4px;
    background: rgba(239,68,68,0.15);
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 10px;
    font-weight: 700;
    color: #EF4444;
  }
  .live-dot {
    width: 6px;
    height: 6px;
    background: #EF4444;
    border-radius: 50%;
    animation: pulse 1.5s infinite;
  }
  .completed-badge {
    background: rgba(74,157,91,0.15);
    color: #4A9D5B;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  @keyframes pulse-ring {
    0% { transform: scale(1); opacity: 0.6; }
    100% { transform: scale(2.2); opacity: 0; }
  }
  .customer-info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .customer-name {
    font-size: 14px;
    font-weight: 600;
  }
  .customer-date {
    font-size: 12px;
    opacity: 0.6;
  }
  .company-call {
    font-size: 9px;
    color: rgba(255,255,255,0.45);
    text-decoration: none;
    margin-left: 6px;
    border: 1px solid rgba(255,255,255,0.15);
    padding: 2px 8px;
    border-radius: 8px;
    font-weight: 600;
    vertical-align: middle;
  }
  .company-call:active {
    background: rgba(255,255,255,0.1);
  }
  .progress-bar-bg {
    background: rgba(255,255,255,0.15);
    border-radius: 6px;
    height: 6px;
    overflow: hidden;
  }
  .progress-bar-fill {
    background: #4A9D5B;
    height: 100%;
    border-radius: 6px;
    transition: width 0.5s ease;
  }
  .progress-text {
    font-size: 11px;
    opacity: 0.6;
    margin-top: 4px;
    text-align: right;
  }

  /* 메인 탭 */
  .main-tabs {
    display: flex;
    background: white;
    border-bottom: 1px solid #E5E5DC;
    position: sticky;
    top: 0;
    z-index: 99;
  }
  .main-tab {
    flex: 1;
    padding: 14px;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    color: #94a3b8;
    cursor: pointer;
    border-bottom: 2.5px solid transparent;
    transition: all 0.2s;
  }
  .main-tab.active {
    color: #1a1a1a;
    border-bottom-color: #4A7C59;
  }
  .main-tab .tab-count {
    display: inline-block;
    background: #4A7C59;
    color: white;
    font-size: 10px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 8px;
    margin-left: 4px;
  }
  .main-tab .defect-count {
    background: #E65100;
  }

  /* 콘텐츠 */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* 아코디언 */
  .accordion-list {
    padding: 10px 12px;
  }
  .accordion-item {
    background: white;
    border-radius: 14px;
    border: 1px solid #E5E5DC;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .accordion-header {
    display: flex;
    align-items: center;
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
  }
  .accordion-icon {
    font-size: 22px;
    margin-right: 10px;
  }
  .accordion-title {
    font-size: 14px;
    font-weight: 700;
    flex: 1;
  }
  .accordion-count {
    font-size: 11px;
    color: #94a3b8;
    margin-right: 8px;
  }
  .accordion-status {
    font-size: 9px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 8px;
    margin-right: 8px;
  }
  .status-waiting { background: #F1F3EE; color: #94a3b8; }
  .status-progress { background: #FEF0E0; color: #E67E22; }
  .status-done { background: #E4F3E6; color: #4A9D5B; }
  .accordion-arrow {
    font-size: 12px;
    color: #94a3b8;
    transition: transform 0.2s;
  }
  .accordion-item.open .accordion-arrow {
    transform: rotate(180deg);
  }
  .accordion-body {
    display: none;
    border-top: 1px solid #F1F3EE;
  }
  .accordion-item.open .accordion-body {
    display: block;
  }

  /* 카테고리 내부 탭 */
  .sub-tabs {
    display: flex;
    border-bottom: 1px solid #F1F3EE;
  }
  .sub-tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    color: #94a3b8;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .sub-tab.active {
    color: #C47F17;
    border-bottom-color: #C47F17;
  }
  .sub-tab.after-active {
    color: #4A9D5B;
    border-bottom-color: #4A9D5B;
  }
  .sub-tab .count {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    color: white;
    padding: 0 5px;
    border-radius: 8px;
    margin-left: 3px;
  }
  .sub-tab .count.before { background: #C47F17; }
  .sub-tab .count.after { background: #4A9D5B; }

  .sub-content { display: none; padding: 10px; }
  .sub-content.active { display: block; }

  /* 피드 카드 */
  .feed-card {
    background: white;
    border-radius: 12px;
    border: 1px solid #E5E5DC;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .feed-card.defect {
    background: #FFF8E1;
    border-color: #FFD54F;
  }
  .feed-header {
    display: flex;
    align-items: center;
    padding: 10px 12px;
    gap: 6px;
  }
  .feed-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }
  .feed-dot.before { background: #C47F17; }
  .feed-dot.after { background: #4A9D5B; }
  .feed-time {
    font-size: 11px;
    color: #94a3b8;
  }
  .defect-label {
    font-size: 11px;
    font-weight: 700;
    color: #E65100;
  }
  .feed-memo {
    padding: 0 12px 8px;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.4;
  }
  .feed-memo.defect-memo {
    background: #FFF3CD;
    margin: 0 12px 8px;
    padding: 6px 10px;
    border-radius: 8px;
    color: #E65100;
  }
  .feed-photos {
    display: grid;
    gap: 2px;
  }
  .feed-photos.one { grid-template-columns: 1fr; }
  .feed-photos.two { grid-template-columns: 1fr 1fr; }
  .feed-photos.three-plus { grid-template-columns: 1fr 1fr; }
  .feed-photos img {
    width: 100%;
    height: 160px;
    object-fit: cover;
    cursor: pointer;
  }
  .feed-photos.one img {
    height: auto !important;
    max-height: 400px;
    object-fit: contain !important;
    background: #F2F3EE;
    border-radius: 4px;
  }

  /* 하자 탭 */
  .defect-section {
    padding: 10px 12px;
  }
  .defect-group-title {
    font-size: 13px;
    font-weight: 700;
    color: #E65100;
    padding: 12px 0 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .defect-card {
    background: #FFF8E1;
    border: 1px solid #FFD54F;
    border-radius: 12px;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .defect-photos {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px;
  }
  .defect-photos img {
    width: 100%;
    height: 140px;
    object-fit: cover;
    cursor: pointer;
  }
  .defect-photos img:only-child {
    grid-column: 1 / -1;
    height: 180px;
  }
  .defect-info {
    padding: 10px 12px;
  }
  .defect-location {
    font-size: 13px;
    font-weight: 700;
    color: #E65100;
  }
  .defect-desc {
    font-size: 12px;
    color: #64748b;
    margin-top: 2px;
  }

  /* 빈 상태 */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: #94a3b8;
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 8px; }
  .empty-state .text { font-size: 14px; }

  /* 전체화면 뷰어 */
  .photo-viewer {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.95);
    z-index: 1000;
    flex-direction: column;
  }
  .photo-viewer.active { display: flex; }
  .viewer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    color: white;
  }
  .viewer-close {
    font-size: 24px;
    cursor: pointer;
    padding: 4px;
  }
  .viewer-counter { font-size: 13px; opacity: 0.7; }
  .viewer-body {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .viewer-body img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .viewer-footer {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 16px 24px;
  }
  .viewer-download {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.15);
    border: none;
    cursor: pointer;
    padding: 10px 20px;
    border-radius: 24px;
    transition: background 0.2s;
    color: white;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
  }
  .viewer-download:active {
    background: rgba(255,255,255,0.3);
  }
  .viewer-download svg {
    width: 18px;
    height: 18px;
    stroke: white;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .viewer-toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(0,0,0,0.75);
    color: white;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    transition: all 0.3s ease;
    z-index: 1100;
    pointer-events: none;
  }
  .viewer-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* 로딩 */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    flex-direction: column;
    gap: 12px;
    color: #94a3b8;
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #E5E5DC;
    border-top-color: #4A7C59;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* PDF 저장 버튼 */
  .pdf-save-bar {
    padding: 16px 12px 24px;
    text-align: center;
  }
  .pdf-save-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #1E293B;
    color: white;
    border: none;
    padding: 14px 32px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.2s;
  }
  .pdf-save-btn:active { opacity: 0.8; }

  /* 후기 작성 */
  .review-section {
    background: white;
    margin-top: 8px;
    padding: 28px 20px 20px;
    border-top: 8px solid #F0EAD9;
  }
  .review-title {
    text-align: center;
    font-size: 18px;
    font-weight: 800;
    color: #0F2442;
    letter-spacing: -0.3px;
    margin-bottom: 6px;
  }
  .review-sub {
    text-align: center;
    font-size: 12px;
    color: #5A6478;
    margin-bottom: 22px;
  }
  .star-rating {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 22px;
  }
  .star {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    color: #E5E5DC;
    cursor: pointer;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .star.filled { color: #E8A33D; }
  .review-label {
    font-size: 11px;
    font-weight: 700;
    color: #0F2442;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .optional {
    color: #C5C9D1;
    font-weight: 400;
    font-size: 9px;
    margin-left: 4px;
    text-transform: none;
    letter-spacing: 0;
  }
  .tag-category-label {
    font-size: 11px;
    color: #8A8E9A;
    font-weight: 500;
    margin-top: 4px;
    margin-bottom: 8px;
    letter-spacing: -0.1px;
  }
  .tag-category-label:first-of-type {
    margin-top: 0;
  }
  .tags-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
  }
  .tags-grid:last-of-type {
    margin-bottom: 22px;
  }
  .tag-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 8px 13px;
    background: white;
    border: 1px solid #E5E7EB;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 500;
    color: #4A5568;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.15s ease;
  }
  .tag-chip .tag-emoji {
    font-size: 13px;
    line-height: 1;
  }
  .tag-chip:hover {
    background: #F9FAFB;
    border-color: #D1D5DB;
  }
  .tag-chip.selected {
    background: #0D1B2E;
    color: white;
    border-color: #0D1B2E;
    font-weight: 600;
  }
  .tag-chip.selected .tag-emoji {
    filter: none;
  }
  .review-textarea {
    width: 100%;
    padding: 14px;
    border: 1px solid #E5E5DC;
    border-radius: 10px;
    font-size: 14px;
    color: #0D1B2E;
    font-family: inherit;
    font-weight: 500;
    min-height: 140px;
    margin-bottom: 6px;
    resize: vertical;
    box-sizing: border-box;
    line-height: 1.6;
  }
  .review-textarea::placeholder { color: #8A8E9A; }
  .review-length-hint {
    font-size: 11px;
    color: #C5C9D1;
    text-align: right;
    margin-bottom: 22px;
    min-height: 14px;
  }
  .review-length-hint.warn {
    color: #E8A33D;
  }
  .name-options {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
  }
  .name-option {
    flex: 1;
    padding: 11px;
    background: white;
    border: 1px solid #E5E5DC;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 700;
    color: #5A6478;
    text-align: center;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .name-option.selected {
    background: #0D1B2E;
    color: white;
    border-color: #0D1B2E;
  }
  .consent-row {
    background: #F5F0E4;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 22px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .consent-checkbox {
    width: 18px;
    height: 18px;
    border: 1.5px solid #8A8E9A;
    border-radius: 4px;
    flex-shrink: 0;
    position: relative;
    background: white;
    margin-top: 1px;
  }
  .consent-checkbox.checked {
    background: #0D1B2E;
    border-color: #0D1B2E;
  }
  .consent-checkbox.checked::after {
    content: '✓';
    position: absolute;
    color: #C9A961;
    font-size: 13px;
    font-weight: 900;
    top: -2px;
    left: 2px;
  }
  .consent-label {
    font-size: 12px;
    font-weight: 700;
    color: #0D1B2E;
    line-height: 1.5;
  }
  .consent-sub {
    font-size: 10px;
    color: #8A8E9A;
    margin-top: 3px;
    line-height: 1.5;
  }
  .review-submit-btn {
    width: 100%;
    padding: 16px;
    background: #0D1B2E;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: -0.01em;
    -webkit-tap-highlight-color: transparent;
  }
  .review-submit-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .review-submit-btn:active:not(:disabled) { opacity: 0.85; }

  /* 작성 완료 상태 */
  .review-done {
    background: white;
    margin-top: 8px;
    padding: 28px 20px 24px;
    border-top: 8px solid #F0EAD9;
    text-align: center;
  }
  .review-done-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #E0F9ED;
    color: #00A65A;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    margin-bottom: 14px;
  }
  .review-done-stars {
    font-size: 22px;
    color: #E8A33D;
    letter-spacing: 4px;
    margin-bottom: 14px;
  }
  .review-done-content {
    font-size: 14px;
    color: #0D1B2E;
    line-height: 1.6;
    font-weight: 500;
    margin-bottom: 14px;
    padding: 14px;
    background: #F8F8F0;
    border-radius: 10px;
    text-align: left;
  }
  .review-done-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    justify-content: center;
    margin-bottom: 14px;
  }
  .review-done-tag {
    padding: 4px 10px;
    background: #F0EAD9;
    border-radius: 14px;
    font-size: 10px;
    font-weight: 600;
    color: #5A6478;
  }
  .review-done-meta {
    font-size: 11px;
    color: #8A8E9A;
  }
  .review-edit-btn {
    margin-top: 14px;
    padding: 10px 18px;
    background: white;
    border: 1px solid #E8E4D9;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 600;
    color: #0D1B2E;
    cursor: pointer;
    transition: all 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .review-edit-btn:hover {
    background: #F5F1E8;
    border-color: #C9A961;
  }
  .review-edit-locked {
    margin-top: 14px;
    font-size: 11px;
    color: #9CA3AF;
    text-align: center;
    font-weight: 500;
  }
  .edit-mode-banner {
    background: #FFF8E5;
    border: 1px solid #F0E0A6;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 12.5px;
    color: #6B5B1F;
    font-weight: 500;
    margin-bottom: 16px;
    line-height: 1.5;
  }
  .review-cancel-btn {
    margin-top: 8px;
    width: 100%;
    padding: 12px;
    background: transparent;
    border: none;
    font-size: 13px;
    color: #8A8E9A;
    cursor: pointer;
    text-decoration: underline;
    -webkit-tap-highlight-color: transparent;
  }

  /* 감사 메시지 토스트 */
  .review-thank-you {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -40%);
    background: rgba(13, 27, 46, 0.95);
    color: white;
    padding: 28px 32px;
    border-radius: 18px;

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ===== 설정 =====
const SUPABASE_URL = 'https://iucicugxihxilcqtzrbk.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1Y2ljdWd4aWh4aWxjcXR6cmJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA2OTc0ODAsImV4cCI6MjA4NjI3MzQ4MH0.5_7_vNc7x2kU68ynssGhf2jPCevkE-OMfSfgmyrkZDA';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ===== 리뷰 상태 =====
let existingReview = null;
let editMode = false; // 편집 모드 활성 여부
let reviewState = {
  rating: 0,
  tags: new Set(),
  nameDisplay: 'masked',
  marketingConsent: false,
};

// 편집 모드 진입 — 기존 후기 값으로 폼 채움
function enterEditMode() {
  if (!existingReview) return;
  reviewState.rating = existingReview.rating || 0;
  reviewState.tags = new Set(existingReview.tags || []);
  reviewState.marketingConsent = !!existingReview.marketing_consent;
  editMode = true;
  render();
}

// 편집 취소 — 변경 사항 폐기, done 뷰로 복귀
function cancelEditMode() {
  editMode = false;
  reviewState = { rating: 0, tags: new Set(), nameDisplay: 'masked', marketingConsent: false };
  render();
}

// 30일 이내 수정 가능 여부
function isEditable(review) {
  if (!review || review.is_hidden) return false;
  const days = (Date.now() - new Date(review.created_at)) / (1000 * 60 * 60 * 24);
  return days <= 30;
}
const REVIEW_TAGS = {
  '청소 품질': [
    { tag: '꼼꼼함', emoji: '🔍' },
    { tag: '깔끔한 마무리', emoji: '✨' },
    { tag: '친환경 자재', emoji: '🌿' },
  ],
  '서비스': [
    { tag: '친절함', emoji: '😊' },
    { tag: '시간 엄수', emoji: '⏰' },
    { tag: '실시간 리포트', emoji: '📱' },
    { tag: '꼼꼼한 설명', emoji: '💬' },
    { tag: '재예약 의사', emoji: '❤️' },
  ],
};

async function fetchExistingReview() {
  try {
    const { data } = await sb.from('reviews')
      .select('*')
      .eq('report_id', reportId)
      .maybeSingle();
    existingReview = data;
  } catch (e) {
    console.error('review fetch error', e);
    existingReview = null;
  }
}

function maskCustomerName(name) {
  if (!name) return '고객';
  if (name.length === 1) return name;
  return name[0] + '○'.repeat(Math.max(1, name.length - 1));
}

function renderReviewDone() {
  const r = existingReview;
  const stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
  const name = r.name_display === 'anonymous' ? '익명' : maskCustomerName(r.customer_name_snapshot);
  const fmt = (iso) => new Date(iso).toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });
  const createdDate = fmt(r.created_at);
  // 수정 후 1분 이상 차이 나면 "수정됨" 표시
  const wasEdited = r.updated_at && (new Date(r.updated_at) - new Date(r.created_at)) > 60000;
  const updatedDate = wasEdited ? fmt(r.updated_at) : null;
  const tagsHtml = Array.isArray(r.tags) && r.tags.length > 0
    ? `<div class="review-done-tags">${r.tags.map(t => `<div class="review-done-tag">#${escapeHtml(t)}</div>`).join('')}</div>`
    : '';
  const contentHtml = r.content ? `<div class="review-done-content">${escapeHtml(r.content)}</div>` : '';
  const editable = isEditable(r);
  return `
    <div class="review-done">
      <div class="review-done-badge">✓ 후기가 등록되었어요</div>
      <div class="review-done-stars">${stars}</div>
      ${contentHtml}
      ${tagsHtml}
      <div class="review-done-meta">
        ${escapeHtml(name)} 고객님 · ${createdDate}${wasEdited ? ` · 수정 ${updatedDate}` : ''}
      </div>
      ${editable
        ? `<button class="review-edit-btn" onclick="enterEditMode()">✏️ 후기 수정하기</button>`
        : `<div class="review-edit-locked">수정 가능 기간(30일)이 지났습니다</div>`}
    </div>
  `;
}

function renderReviewForm() {
  const isEdit = editMode && !!existingReview;
  const initialContent = isEdit ? (existingReview.content || '') : '';
  const submitDisabled = reviewState.rating === 0;

  return `
    <div class="review-section">
      ${isEdit ? `
        <div class="edit-mode-banner">
          ✏️ 이미 작성하신 후기를 불러왔어요. 자유롭게 수정 가능합니다.
        </div>
      ` : ''}

      <div class="review-title">${isEdit ? '✏️ 후기 수정하기' : '✨ 청소 어떠셨어요?'}</div>
      <div class="review-sub">${isEdit ? '내용을 변경하신 후 저장해주세요' : '사장님께 소중한 후기를 남겨주세요'}</div>

      <div class="star-rating" id="starRating">
        ${[1,2,3,4,5].map(i => `<span class="star ${reviewState.rating >= i ? 'selected' : ''}" onclick="selectStar(${i})">★</span>`).join('')}
      </div>

      <div class="review-label">좋았던 점 <span class="optional">(선택)</span></div>
      ${Object.entries(REVIEW_TAGS).map(([category, tags]) => `
        <div class="tag-category-label">${category}</div>
        <div class="tags-grid">
          ${tags.map(t => `<div class="tag-chip ${reviewState.tags.has(t.tag) ? 'selected' : ''}" onclick="toggleReviewTag(this, '${t.tag}')"><span class="tag-emoji">${t.emoji}</span>${t.tag}</div>`).join('')}
        </div>
      `).join('')}

      <div class="review-label">후기 작성란 <span class="optional">(선택)</span></div>
      <textarea class="review-textarea" id="reviewContent" placeholder="청소 받은 경험을 들려주세요. 자세히 적어주실수록 사장님께 큰 힘이 됩니다 🙏" maxlength="500" oninput="updateReviewLength()">${escapeHtml(initialContent)}</textarea>
      <div class="review-length-hint" id="reviewLengthHint"></div>


      <div class="consent-row" onclick="toggleConsent()">
        <div class="consent-checkbox ${reviewState.marketingConsent ? 'checked' : ''}" id="consentCheckbox"></div>
        <div>
          <div class="consent-label">사장님 마케팅에 공개 동의 <span class="optional">(선택)</span></div>
          <div class="consent-sub">미니 홈페이지·SNS 콘텐츠에 활용될 수 있습니다</div>
        </div>
      </div>

      <button class="review-submit-btn" id="reviewSubmitBtn" ${submitDisabled ? 'disabled' : ''} onclick="submitReview()">
        ${submitDisabled ? '별점을 선택해주세요' : (isEdit ? '수정하기 →' : '후기 남기기 →')}
      </button>

      ${isEdit ? `
        <button class="review-cancel-btn" onclick="cancelEditMode()">취소</button>
      ` : ''}
    </div>
  `;
}

function selectStar(n) {
  reviewState.rating = n;
  const stars = document.querySelectorAll('#starRating .star');
  stars.forEach((s, i) => s.classList.toggle('filled', i < n));
  updateReviewLength();
}

// 후기 길이 + 별점 상태에 따라 버튼 텍스트·활성 상태 갱신
function updateReviewLength() {
  const content = (document.getElementById('reviewContent')?.value || '').trim();
  const len = content.length;
  const hint = document.getElementById('reviewLengthHint');
  const btn = document.getElementById('reviewSubmitBtn');
  const isEdit = editMode && !!existingReview;

  // 길이 안내 — 1~9자일 때만 안내 표시 (0자 또는 10자+ 는 OK)
  if (hint) {
    if (len === 0) {
      hint.textContent = '';
      hint.classList.remove('warn');
    } else if (len < 10) {
      hint.textContent = `최소 10자 이상 작성해주세요 (${len}/10)`;
      hint.classList.add('warn');
    } else {
      hint.textContent = `${len}자`;
      hint.classList.remove('warn');
    }
  }

  // 등록 가능 조건: 별점 1+ AND (후기 비어있거나 10자 이상)
  const ratingOk = reviewState.rating > 0;
  const contentOk = len === 0 || len >= 10;
  const canSubmit = ratingOk && contentOk;

  if (btn) {
    btn.disabled = !canSubmit;
    if (!ratingOk) {
      btn.textContent = '별점을 선택해주세요';
    } else if (!contentOk) {
      btn.textContent = '10자 이상 작성해주세요';
    } else {
      btn.textContent = isEdit ? '수정하기 →' : '후기 남기기 →';
    }
  }
}

function toggleReviewTag(el, tag) {
  if (reviewState.tags.has(tag)) {
    reviewState.tags.delete(tag);
    el.classList.remove('selected');
  } else {
    reviewState.tags.add(tag);
    el.classList.add('selected');
  }
}

function toggleConsent() {
  reviewState.marketingConsent = !reviewState.marketingConsent;
  document.getElementById('consentCheckbox').classList.toggle('checked', reviewState.marketingConsent);
}

async function submitReview() {
  if (!reviewState.rating) return;
  const content = (document.getElementById('reviewContent')?.value || '').trim();
  // 빈 후기는 OK, 작성했다면 10자 이상 (안전장치)
  if (content.length > 0 && content.length < 10) {
    alert('후기는 10자 이상 작성해주세요.');
    return;
  }
  const btn = document.getElementById('reviewSubmitBtn');
  btn.disabled = true;
  const originalText = btn.textContent;
  const isEdit = editMode && !!existingReview;
  btn.textContent = isEdit ? '수정 중...' : '등록 중...';

  try {

    if (isEdit) {
      // === 수정 모드: UPDATE ===
      const updateFields = {
        rating: reviewState.rating,
        content: content || null,
        tags: Array.from(reviewState.tags),
        marketing_consent: reviewState.marketingConsent,
      };

      const result = await sb.from('reviews')
        .update(updateFields)
        .eq('report_id', reportId);

      if (result.error) {
        console.error('review update error', result.error);
        const isOutOfWindow = /policy|permission|denied/i.test(result.error.message || '');
        alert(isOutOfWindow
          ? '수정 가능 기간(30일)이 지났거나 권한이 없습니다.'
          : '후기 수정에 실패했습니다. 잠시 후 다시 시도해주세요.');
        btn.disabled = false;
        btn.textContent = originalText;
        return;
      }

      // 로컬 상태 갱신
      existingReview = {
        ...existingReview,
        ...updateFields,
        updated_at: new Date().toISOString(),
      };
      editMode = false;
      render();

      showReviewThankYou('✓ 후기가 수정되었어요');
      setTimeout(() => {
        const doneEl = document.querySelector('.review-done');
        if (doneEl) doneEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 200);
      return;
    }

    // === 신규 모드: INSERT (기존 로직) ===
    const customerName = reportData?.bookings?.customer_name || reportData?.bookings?.customers?.name || '';
    const customerPhone = reportData?.bookings?.customer_phone || reportData?.bookings?.customers?.phone || '';
    const serviceType = reportData?.bookings?.service_type || '';
    const bookingId = reportData?.booking_id || null;
    const companyId = reportData?.bookings?.company_id || reportData?.company_id || null;

    if (!bookingId || !companyId) {
      alert('리포트 정보를 불러올 수 없습니다. 새로고침 후 다시 시도해주세요.');
      btn.disabled = false;
      btn.textContent = originalText;
      return;
    }

    // 48시간 검토 정책: 등록 시 hold_until 세팅 · is_published=false · pg_cron이 48h 후 자동 published=true
    const holdUntil = new Date(Date.now() + 48 * 60 * 60 * 1000).toISOString();
    const payload = {
      report_id: reportId,
      booking_id: bookingId,
      company_id: companyId,
      rating: reviewState.rating,
      content: content || null,
      tags: Array.from(reviewState.tags),
      name_display: reviewState.nameDisplay,
      customer_name_snapshot: customerName,
      customer_phone_snapshot: customerPhone || null,
      service_type_snapshot: serviceType,
      marketing_consent: reviewState.marketingConsent,
      hold_until: holdUntil,
      is_published: false,
    };

    const result = await sb.from('reviews').insert(payload);

    if (result.error) {
      const isDuplicate = result.error.code === '23505'
        || /duplicate|already exists|reviews_report_id/i.test(result.error.message || '');
      if (isDuplicate) {
        alert('이미 이 리포트에 후기가 등록되어 있어요.\n중복 작성은 불가능합니다.');
      } else {
        alert('후기 등록에 실패했습니다. 잠시 후 다시 시도해주세요.');
      }
      btn.disabled = false;
      btn.textContent = originalText;
      return;
    }

    // RLS로 익명 SELECT 불가 → 로컬 payload로 상태 구성
    existingReview = {
      ...payload,
      created_at: new Date().toISOString(),
    };
    render();

    showReviewThankYou();
    setTimeout(() => {
      const doneEl = document.querySelector('.review-done');
      if (doneEl) doneEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 200);
  } catch (err) {
    console.error('review submit error', err);
    alert('잠시 후 다시 시도해주세요.');
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function showReviewThankYou(customTitle) {
  const existing = document.getElementById('reviewThankYou');
  if (existing) existing.remove();
  const el = document.createElement('div');
  el.id = 'reviewThankYou';
  el.className = 'review-thank-you';
  const title = customTitle || '후기가 등록되었습니다';
  const sub = customTitle ? '변경 사항이 저장됐어요' : '소중한 후기 감사드립니다 🙏';
  el.innerHTML = `
    <div class="review-thank-you-icon">✨</div>
    <div class="review-thank-you-title">${escapeHtml(title)}</div>
    <div class="review-thank-you-sub">${escapeHtml(sub)}</div>
  `;
  document.body.appendChild(el);
  // 진입 애니메이션
  requestAnimationFrame(() => el.classList.add('show'));
  // 2.8초 후 자동 제거
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 300);
  }, 2800);
}

const CATEGORIES = [
  { key: '현관', icon: '🚪' },
  { key: '거실', icon: '🛋️' },
  { key: '주방', icon: '🍳' },
  { key: '화장실', icon: '🚿' },
  { key: '안방', icon: '🛏️' },
  { key: '안방 화장실', icon: '🚿' },
  { key: '방1', icon: '🛏️' },
  { key: '방2', icon: '🛏️' },
  { key: '방3', icon: '🛏️' },
  { key: '드레스룸', icon: '👔' },
  { key: '다용도실', icon: '🧹' },
  { key: '베란다', icon: '🌿' },
  { key: '안방 베란다', icon: '🌿' },
  { key: '팬트리', icon: '🗄️' },
];

let reportData = null;
let companyData = null;
let entries = [];
let defects = [];
let currentTab = 'status'; // status | defects
let categoriesWithData = [];
let reportId = null; // 전역으로 승격 (다른 함수에서 접근 필요)

// ===== 초기화 =====
async function init() {
  const params = new URLSearchParams(window.location.search);
  reportId = params.get('id');

  if (!reportId) {
    document.getElementById('app').innerHTML = `
      <div class="empty-state" style="margin-top:100px">
        <div class="icon">❌</div>
        <div class="text">유효하지 않은 링크입니다</div>
      </div>`;
    return;
  }

  try {
    // 리포트 기본 정보 (bookings → customers, companies 조인)
    const { data: report } = await sb
      .from('cleaning_reports')
      .select('*, bookings(*, customers(name, phone), companies(name, logo_url))')
      .eq('id', reportId)
      .single();

    if (!report) {
      document.getElementById('app').innerHTML = `
        <div class="empty-state" style="margin-top:100px">
          <div class="icon" style="font-size:48px;margin-bottom:16px">📋</div>
          <div class="text" style="font-size:16px;font-weight:600;margin-bottom:8px">보관 기간이 만료되었습니다</div>
          <div class="text" style="font-size:13px;color:#94a3b8">리포트는 생성일로부터 6개월간 보관됩니다</div>
        </div>`;
      return;
    }
    reportData = report;
    companyData = report.bookings?.companies || (report.company_name_snapshot ? { name: report.company_name_snapshot, logo_url: report.company_logo_url_snapshot } : null);

    // 엔트리 + 사진
    const { data: entryData } = await sb
      .from('report_entries')
      .select('*, report_photos(*)')
      .eq('report_id', reportId)
      .order('created_at', { ascending: false });

    entries = entryData || [];

    // 하자
    const { data: defectData } = await sb
      .from('report_defects')
      .select()
      .eq('report_id', reportId)
      .order('created_at', { ascending: false });

    defects = defectData || [];

    // 하자에 entry 사진 연결
    for (const d of defects) {
      if (d.entry_id) {
        const { data: photos } = await sb
          .from('report_photos')
          .select()
          .eq('entry_id', d.entry_id)
          .order('sort_order');
        d.all_photos = photos || [];
      } else {
        d.all_photos = d.photo_url ? [{ photo_url: d.photo_url }] : [];
      }
    }

    await fetchExistingReview();
    render();
    setupRealtime(reportId);

    // Safari에서 print 파라미터로 열렸으면 자동 PDF 실행
    if (params.get('print') === '1') {
      currentTab = 'defects';
      render();
      const images = document.querySelectorAll('#defectsTab img[loading="lazy"]');
      images.forEach(img => img.removeAttribute('loading'));
      const allLoaded = Array.from(images).map(img => {
        if (img.complete) return Promise.resolve();
        return new Promise(resolve => { img.onload = resolve; img.onerror = resolve; });
      });
      Promise.all(allLoaded).then(() => setTimeout(() => window.print(), 500));
    }
  } catch (e) {
    document.getElementById('app').innerHTML = `
      <div class="empty-state" style="margin-top:100px">
        <div class="icon">😢</div>
        <div class="text">${e.message}</div>
      </div>`;
  }
}

// ===== 실시간 업데이트 =====
function setupRealtime(reportId) {
  sb.channel('report-' + reportId)
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'cleaning_reports', filter: `id=eq.${reportId}` },
      () => refreshData(reportId))
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'report_entries', filter: `report_id=eq.${reportId}` },
      () => refreshData(reportId))
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'report_photos', filter: `report_id=eq.${reportId}` },
      () => refreshData(reportId))
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'report_defects', filter: `report_id=eq.${reportId}` },
      () => refreshData(reportId))
    .subscribe();
}

async function refreshData(reportId) {
  // 리포트 기본 정보 갱신 (구역 순서/아이콘/숨김 등)
  const { data: freshReport } = await sb
    .from('cleaning_reports')
    .select('*, bookings(*, customers(name), companies(name, logo_url))')
    .eq('id', reportId)
    .single();
  if (freshReport) {
    reportData = freshReport;
    companyData = freshReport.bookings?.companies || (freshReport.company_name_snapshot ? { name: freshReport.company_name_snapshot, logo_url: freshReport.company_logo_url_snapshot } : null);
  }

  const { data: entryData } = await sb
    .from('report_entries')
    .select('*, report_photos(*)')
    .eq('report_id', reportId)
    .order('created_at', { ascending: false });
  entries = entryData || [];

  const { data: defectData } = await sb
    .from('report_defects')
    .select()
    .eq('report_id', reportId)
    .order('created_at', { ascending: false });
  defects = defectData || [];

  for (const d of defects) {
    if (d.entry_id) {
      const { data: photos } = await sb
        .from('report_photos')
        .select()
        .eq('entry_id', d.entry_id)
        .order('sort_order');
      d.all_photos = photos || [];
    } else {
      d.all_photos = d.photo_url ? [{ photo_url: d.photo_url }] : [];
    }
  }

  render();
}

// ===== 렌더링 =====
function render() {
  const booking = reportData.bookings;
  const customer = booking;
  const isCompleted = reportData.status === 'completed';

  // 회사 로고 HTML
  const logoHtml = companyData?.logo_url
    ? `<img class="company-logo" src="${companyData.logo_url}" alt="logo">`
    : '';
  const companyName = companyData?.name || '청소 리포트';
  const contactPhone = reportData.contact_phone || '';

  // 숨긴 구역 필터링
  const hiddenSet = new Set(reportData.hidden_categories || []);
  const visibleCategories = CATEGORIES.filter(c => !hiddenSet.has(c.key));

  // 커스텀 구역 자동 감지 + 아이콘 맵
  const categoryIcons = reportData.category_icons || {};
  const categoryOrder = reportData.category_order || [];
  const defaultKeys = new Set(CATEGORIES.map(c => c.key));
  const customCats = [];
  // entries에서 커스텀 구역 감지
  for (const e of entries) {
    if (!defaultKeys.has(e.category) && !hiddenSet.has(e.category) && !customCats.find(c => c.key === e.category)) {
      customCats.push({ key: e.category, icon: categoryIcons[e.category] || '📁' });
    }
  }
  // category_order에 있지만 entries에 없는 커스텀 구역도 추가
  for (const key of categoryOrder) {
    if (!defaultKeys.has(key) && !hiddenSet.has(key) && !customCats.find(c => c.key === key)) {
      customCats.push({ key: key, icon: categoryIcons[key] || '📁' });
    }
  }
  // 기본 구역도 아이콘 오버라이드 적용
  visibleCategories.forEach(c => {
    if (categoryIcons[c.key]) c.icon = categoryIcons[c.key];
  });
  let allCategories = [...visibleCategories, ...customCats];

  // 저장된 순서 적용
  if (categoryOrder.length > 0) {
    const ordered = [];
    for (const key of categoryOrder) {
      const cat = allCategories.find(c => c.key === key);
      if (cat) ordered.push(cat);
    }
    for (const cat of allCategories) {
      if (!ordered.find(c => c.key === cat.key)) ordered.push(cat);
    }
    allCategories = ordered;
  }

  categoriesWithData = allCategories.map(cat => {
    const catEntries = entries.filter(e => e.category === cat.key);
    const beforeEntries = catEntries.filter(e => e.photo_type === 'before');
    const afterEntries = catEntries.filter(e => e.photo_type === 'after');
    const beforeCount = beforeEntries.reduce((s, e) => s + (e.report_photos?.length || 0), 0);
    const afterCount = afterEntries.reduce((s, e) => s + (e.report_photos?.length || 0), 0);
    const totalCount = beforeCount + afterCount;

    let status = 'waiting';
    if (afterCount > 0) status = 'done';
    else if (beforeCount > 0) status = 'progress';

    return { ...cat, beforeEntries, afterEntries, beforeCount, afterCount, totalCount, status };
  });

  const activeCats = categoriesWithData.filter(c => c.totalCount > 0);
  const totalPhotos = categoriesWithData.reduce((s, c) => s + c.totalCount, 0);
  const doneCats = categoriesWithData.filter(c => c.status === 'done').length;
  const progress = activeCats.length > 0 ? Math.round((doneCats / activeCats.length) * 100) : 0;

  document.getElementById('app').innerHTML = `
    <!-- 헤더 -->
    <div class="header" style="position:static">
      <div style="margin-bottom:16px">
        <span style="display:inline-block;padding:4px 12px;border:1.5px solid rgba(255,255,255,0.25);border-radius:10px;font-size:10px;font-weight:600;color:rgba(255,255,255,0.6);letter-spacing:0.5px">✨ 프리미엄 청소 리포트</span>
      </div>
      <div class="header-top">
        <div class="company-info">
          ${logoHtml ? `<img class="company-logo" src="${companyData.logo_url}" alt="logo" style="width:40px;height:40px;border-radius:10px">` : ''}
          <div>
            <div class="company-name" style="font-size:17px">${companyName}${contactPhone ? `<a href="tel:${contactPhone}" class="company-call">문의</a>` : ''}</div>
          </div>
        </div>
        <div style="text-align:right">
          ${isCompleted
            ? `<div class="live-badge completed-badge" style="display:inline-flex">✓ 완료</div>`
            : `<div style="display:inline-flex;align-items:center;gap:5px">
                <div style="position:relative;width:7px;height:7px">
                  <div style="position:absolute;inset:0;background:#4A9D5B;border-radius:50%"></div>
                  <div style="position:absolute;inset:-3px;border:2px solid #4A9D5B;border-radius:50%;animation:pulse-ring 1.5s infinite;opacity:0"></div>
                </div>
                <span style="font-size:10px;font-weight:600;color:#4A9D5B">현재 청소중</span>
              </div>`}
          ${!isCompleted ? `<div style="font-size:10px;color:rgba(255,255,255,0.3);margin-top:2px">실시간으로 업데이트됩니다</div>` : ''}
          <div style="font-size:11px;color:rgba(255,255,255,0.35);margin-top:4px">${booking?.scheduled_date || reportData.scheduled_date_snapshot || ''}</div>
        </div>
      </div>
      <div style="margin-top:10px;font-size:12px;color:rgba(255,255,255,0.5)">
        <span onclick="var f=this.parentNode.querySelector('.customer-full');var m=this.parentNode.querySelector('.customer-masked');if(f.style.display==='none'){f.style.display='inline';m.style.display='none'}else{f.style.display='none';m.style.display='inline'}" style="cursor:pointer">
          <span class="customer-masked">${(booking?.customer_name || booking?.customers?.name || reportData.customer_name_snapshot || '고객').charAt(0)}*님 ▸</span>
          <span class="customer-full" style="display:none;color:rgba(255,255,255,0.85);font-weight:600">${booking?.customer_name || booking?.customers?.name || reportData.customer_name_snapshot || '고객'}님 ◂</span>
        </span>
        ${reportData?.customer_phone_tail ? `<span style="margin-left:6px">010-****-**${reportData.customer_phone_tail}</span>` : ''}
      </div>
    </div>

    <!-- 메인 탭 -->
    <div class="main-tabs">
      <div class="main-tab ${currentTab === 'status' ? 'active' : ''}" onclick="switchTab('status')">
        청소 현황
      </div>
      <div class="main-tab ${currentTab === 'defects' ? 'active' : ''}" onclick="switchTab('defects')">
        하자 체크 <span class="tab-count defect-count">${defects.length}</span>
      </div>
    </div>

    <!-- 청소 현황 탭 -->
    <div class="tab-content ${currentTab === 'status' ? 'active' : ''}" id="statusTab">
      <div class="accordion-list">
        ${categoriesWithData.map((cat, i) => renderAccordion(cat, i)).join('')}
      </div>
    </div>

    <!-- 하자 체크 탭 -->
    <div class="tab-content ${currentTab === 'defects' ? 'active' : ''}" id="defectsTab">
      ${renderDefectsTab()}
      ${defects.length > 0 ? `
        <div class="pdf-save-bar">
          <button class="pdf-save-btn" onclick="savePdf()">
            📄 하자 리포트 PDF 저장
          </button>
        </div>
      ` : ''}
    </div>

    <!-- 후기 작성/조회 (완료된 리포트에서만 노출) -->
    ${reportData?.status === 'completed' && totalPhotos > 0
      ? ((existingReview && !editMode) ? renderReviewDone() : renderReviewForm())
      : ''}

    <!-- 하단 안내 + 푸터 -->
    ${totalPhotos > 0 ? `
      <div class="share-bar">
        <div style="text-align:center;font-size:12px;color:#94a3b8;line-height:1.7">사진은 꾹 눌러 저장, 리포트 화면은 캡쳐하여<br>기타 SNS 후기 작성에 활용해주셔도 좋습니다</div>
        <div style="text-align:right;font-size:9px;color:#c4c4c4;margin-top:8px;padding-right:4px">Powered by 클리닝매니저</div>
      </div>
    ` : ''}
  `;
}

function renderAccordion(cat, index) {
  const statusClass = cat.status === 'done' ? 'status-done' :
                       cat.status === 'progress' ? 'status-progress' : 'status-waiting';
  const statusText = cat.status === 'done' ? '✓ 완료' :
                     cat.status === 'progress' ? '진행중' : '대기';

  if (cat.totalCount === 0) {
    return `
      <div class="accordion-item">
        <div class="accordion-header" style="opacity:0.5">
          <span class="accordion-icon">${cat.icon}</span>
          <span class="accordion-title">${cat.key}</span>
          <span class="accordion-status ${statusClass}">${statusText}</span>
        </div>
      </div>`;
  }

  return `
    <div class="accordion-item" id="acc-${index}">
      <div class="accordion-header" onclick="toggleAccordion(${index})">
        <span class="accordion-icon">${cat.icon}</span>
        <span class="accordion-title">${cat.key}</span>
        <span class="accordion-count">${cat.totalCount}장</span>
        <span class="accordion-status ${statusClass}">${statusText}</span>
        <span class="accordion-arrow">▼</span>
      </div>
      <div class="accordion-body">
        <div class="sub-tabs">
          <div class="sub-tab ${cat.status !== 'done' ? 'active' : ''}" id="sub-before-${index}" onclick="switchSubTab(${index}, 'before')">
            청소 전 <span class="count before">${cat.beforeCount}</span>
          </div>
          <div class="sub-tab ${cat.status === 'done' ? 'after-active' : ''}" id="sub-after-${index}" onclick="switchSubTab(${index}, 'after')">
            청소 후 <span class="count after">${cat.afterCount}</span>
          </div>
        </div>
        <div class="sub-content ${cat.status !== 'done' ? 'active' : ''}" id="sub-content-before-${index}">
          ${cat.beforeEntries.length > 0
            ? cat.beforeEntries.map(e => renderFeedCard(e, 'before')).join('')
            : '<div class="empty-state"><div class="icon">📷</div><div class="text">아직 사진이 없습니다</div></div>'}
        </div>
        <div class="sub-content ${cat.status === 'done' ? 'active' : ''}" id="sub-content-after-${index}">
          ${cat.afterEntries.length > 0
            ? cat.afterEntries.map(e => renderFeedCard(e, 'after')).join('')
            : '<div class="empty-state"><div class="icon">✨</div><div class="text">아직 사진이 없습니다</div></div>'}
        </div>
      </div>
    </div>`;
}

function isVideoUrl(url) {
  const lower = (url || '').toLowerCase();
  return lower.includes('.mp4') || lower.includes('.mov') || lower.includes('.avi');
}

function renderMediaThumb(photo, photoUrls, videoUrlMap, index, isLast, remaining) {
  const url = photo.photo_url;
  const hasVideo = !!photo.video_url || isVideoUrl(url);
  const jsonUrls = JSON.stringify(photoUrls).replace(/"/g, '&quot;');
  const jsonVids = JSON.stringify(videoUrlMap).replace(/"/g, '&quot;');
  const onclick = `openViewer(${jsonUrls}, ${index}, ${jsonVids})`;

  if (hasVideo) {
    return `<div style="position:relative;cursor:pointer;background:#1a1a1a;min-height:120px;display:flex;align-items:center;justify-content:center" onclick="${onclick}">
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <div style="background:rgba(255,255,255,0.15);border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center">
          <div style="color:white;font-size:20px;margin-left:2px">▶</div>
        </div>
        <div style="color:rgba(255,255,255,0.5);font-size:11px">영상</div>
      </div>
      ${isLast ? `<div style="position:absolute;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;color:white;font-size:20px;font-weight:700">+${remaining}</div>` : ''}
    </div>`;
  }
  if (isLast) {
    return `<div style="position:relative;cursor:pointer" onclick="${onclick}">
      <img src="${url}" loading="lazy" style="pointer-events:none">
      <div style="position:absolute;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;color:white;font-size:20px;font-weight:700">+${remaining}</div>
    </div>`;
  }
  return `<img src="${url}" onclick="${onclick}" loading="lazy">`;
}

function renderFeedCard(entry, type) {
  const photos = entry.report_photos || [];
  const isDefect = entry.is_defect === true;
  const time = entry.created_at ? new Date(entry.created_at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) : '';
  const photoUrls = photos.map(p => p.photo_url);
  const videoUrlMap = photos.map(p => p.video_url || null);

  const gridClass = photos.length === 1 ? 'one' : photos.length === 2 ? 'two' : 'three-plus';
  const displayPhotos = photos.slice(0, 4);
  const remaining = photos.length - 4;

  return `
    <div class="feed-card ${isDefect ? 'defect' : ''}">
      <div class="feed-header">
        ${isDefect
          ? '<span style="font-size:12px">⚠️</span><span class="defect-label">하자</span>'
          : `<div class="feed-dot ${type}"></div>`}
        <span class="feed-time">${time}</span>
      </div>
      ${entry.memo ? `<div class="${isDefect ? 'feed-memo defect-memo' : 'feed-memo'}">${entry.memo}</div>` : ''}
      ${photos.length > 0 ? `
        <div class="feed-photos ${gridClass}">
          ${displayPhotos.map((p, i) => renderMediaThumb(p, photoUrls, videoUrlMap, i, i === 3 && remaining > 0, remaining)).join('')}
        </div>
      ` : ''}
    </div>`;
}

function renderDefectsTab() {
  if (defects.length === 0) {
    return `
      <div class="empty-state" style="margin-top:40px">
        <div style="width:48px;height:48px;border-radius:50%;background:rgba(74,157,91,0.08);display:flex;align-items:center;justify-content:center;margin:0 auto 12px">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A9D5B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <div class="text">발견된 하자가 없습니다</div>
      </div>`;
  }

  // 구역별 그룹핑
  const grouped = {};
  for (const d of defects) {
    const cat = d.category || d.location || '기타';
    if (!grouped[cat]) grouped[cat] = [];
    grouped[cat].push(d);
  }

  let html = '<div class="defect-section">';

  for (const [category, items] of Object.entries(grouped)) {
    const catInfo = CATEGORIES.find(c => c.key === category);
    const icon = catInfo ? catInfo.icon : '📁';

    html += `
      <div class="defect-group-title">
        <span>${icon}</span>
        <span>${category}</span>
        <span style="font-size:11px;color:#94a3b8;font-weight:400">${items.length}건</span>
      </div>`;

    for (const d of items) {
      const photoUrls = d.all_photos.map(p => p.photo_url);

      html += `
        <div class="defect-card">
          ${photoUrls.length > 0 ? `
            <div class="defect-photos">
              ${photoUrls.map((url, i) => `
                <img src="${url}" onclick="openViewer(${JSON.stringify(photoUrls).replace(/"/g, '&quot;')}, ${i})" loading="lazy">
              `).join('')}
            </div>
          ` : ''}
          <div class="defect-info">
            <div class="defect-location">⚠️ ${d.location || category}${photoUrls.length > 1 ? ` · ${photoUrls.length}장` : ''}</div>
            ${d.description ? `<div class="defect-desc">${d.description}</div>` : ''}
          </div>
        </div>`;
    }
  }

  html += '</div>';
  return html;
}

// ===== 인터랙션 =====
function switchTab(tab) {
  currentTab = tab;
  render();
  pushState();
}

function toggleAccordion(index) {
  const el = document.getElementById('acc-' + index);
  if (!el) return;
  const wasOpen = el.classList.contains('open');
  el.classList.toggle('open');
  if (!wasOpen) pushState();
}

function switchSubTab(index, type) {
  const beforeTab = document.getElementById('sub-before-' + index);
  const afterTab = document.getElementById('sub-after-' + index);
  const beforeContent = document.getElementById('sub-content-before-' + index);
  const afterContent = document.getElementById('sub-content-after-' + index);

  if (type === 'before') {
    beforeTab.className = 'sub-tab active';
    afterTab.className = 'sub-tab';
    beforeContent.className = 'sub-content active';
    afterContent.className = 'sub-content';
  } else {
    beforeTab.className = 'sub-tab';
    afterTab.className = 'sub-tab after-active';
    beforeContent.className = 'sub-content';
    afterContent.className = 'sub-content active';
  }
}

// ===== PDF 저장 =====
function savePdf() {
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const isInApp = /KAKAOTALK|NAVER|Line|Instagram|FBAN|FBAV/i.test(navigator.userAgent);

  // iOS 인앱 브라우저: 링크 복사 + 안내
  if (isIOS && isInApp) {
    navigator.clipboard.writeText(window.location.href).catch(() => {});
    alert('카카오톡 등 인앱 브라우저에서는\nPDF 저장이 지원되지 않습니다.\n\n링크가 복사되었습니다.\nSafari에서 해당 링크를 열어\nPDF를 다운받아주세요.');
    return;
  }

  // 하자 탭으로 전환
  if (currentTab !== 'defects') {
    currentTab = 'defects';
    render();
  }

  // lazy 이미지 모두 프리로드 후 인쇄
  const images = document.querySelectorAll('#defectsTab img[loading="lazy"]');
  images.forEach(img => img.removeAttribute('loading'));

  const allLoaded = Array.from(images).map(img => {
    if (img.complete) return Promise.resolve();
    return new Promise(resolve => {
      img.onload = resolve;
      img.onerror = resolve;
    });
  });

  Promise.all(allLoaded).then(() => {
    setTimeout(() => window.print(), 200);
  });
}

// ===== 사진 뷰어 =====
let viewerPhotos = [];
let viewerVideoUrls = [];
let viewerIndex = 0;
let touchStartX = 0;

function openViewer(urls, index, videoUrls) {
  viewerPhotos = urls;
  viewerVideoUrls = videoUrls || [];
  viewerIndex = index;
  // 모든 사진 프리로드 (5장째부터 로딩 지연 방지)
  urls.forEach(url => { if (!isVideoUrl(url)) { const img = new Image(); img.src = url; } });
  updateViewer();
  document.getElementById('photoViewer').classList.add('active');
  document.body.style.overflow = 'hidden';
  pushState();
}

function closeViewer() {
  const video = document.querySelector('#viewerBody video');
  if (video) video.pause();
  document.getElementById('photoViewer').classList.remove('active');
  document.body.style.overflow = '';
}

function isInAppBrowser() {
  return /KAKAOTALK|NAVER|Line|Instagram|FBAN|FBAV/i.test(navigator.userAgent);
}

function updateViewer() {
  document.getElementById('viewerCounter').textContent =
    `${viewerIndex + 1} / ${viewerPhotos.length}`;
  const videoUrl = viewerVideoUrls[viewerIndex];
  if (videoUrl) {
    document.getElementById('viewerBody').innerHTML =
      `<video src="${videoUrl}" controls playsinline preload="metadata" style="max-width:100%;max-height:80vh"></video>`;
  } else {
    document.getElementById('viewerBody').innerHTML =
      `<img src="${viewerPhotos[viewerIndex]}" style="max-width:100%;max-height:100%;object-fit:contain;-webkit-touch-callout:default">`;
  }
}

async function downloadPhoto() {
  const url = viewerVideoUrls[viewerIndex] || viewerPhotos[viewerIndex];
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

  if (isIOS) {
    window.open(url, '_blank');
    showToast('사진을 길게 눌러 저장하세요');
    return;
  }

  if (isInAppBrowser()) {
    window.open(url, '_blank');
    showToast('사진을 길게 눌러 저장하세요');
    return;
  }

  try {
    const res = await fetch(url);
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const isVid = isVideoUrl(url);
    a.download = isVid ? 'cleanops_video_' + (viewerIndex + 1) + '.mp4' : 'cleanops_photo_' + (viewerIndex + 1) + '.jpg';
    a.click();
    URL.revokeObjectURL(a.href);
    showToast('저장되었습니다');
  } catch (e) {
    window.open(url, '_blank');
  }
}

function showToast(msg) {
  const t = document.getElementById('viewerToast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

function handleTouchStart(e) {
  touchStartX = e.touches[0].clientX;
}
function handleTouchMove(e) {
  e.preventDefault();
}
function handleTouchEnd(e) {
  const diff = touchStartX - e.changedTouches[0].clientX;
  if (Math.abs(diff) > 50) {
    if (diff > 0 && viewerIndex < viewerPhotos.length - 1) {
      viewerIndex++;
      updateViewer();
    } else if (diff < 0 && viewerIndex > 0) {
      viewerIndex--;
      updateViewer();
    }
  }
}

// ===== 뒤로가기 처리 =====
function pushState() {
  history.pushState({ inApp: true }, '');
}

window.addEventListener('popstate', function(e) {
  // 1. 사진 뷰어가 열려있으면 닫기
  const viewer = document.getElementById('photoViewer');
  if (viewer && viewer.classList.contains('active')) {
    closeViewer();
    pushState();
    return;
  }

  // 2. 그 외: 아코디언 모두 접고 청소현황 탭으로
  const openAccs = document.querySelectorAll('.accordion-item.open');
  if (openAccs.length > 0 || currentTab !== 'status') {
    openAccs.forEach(el => el.classList.remove('open'));
    if (currentTab !== 'status') {
      currentTab = 'status';
      render();
    }
    pushState();
    return;
  }

  // 3. 이미 목록 상태면 페이지에서 나감 (기본 동작)
});

// iOS/인앱 브라우저 힌트는 isInAppBrowser()에서 처리

// 카톡 인앱 브라우저 힌트 표시
if (isInAppBrowser()) {
  const hint = document.getElementById('inAppHint');
  if (hint) hint.style.display = 'block';
}

// 시작
pushState(); // 초기 히스토리 쌓기
init();
</script>
