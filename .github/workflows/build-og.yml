name: Build OG pages

on:
  # ⚠️ 비활성화 — 정적 파일이 데이터 fetch 로직 없이 placeholder만 응답하는 문제 발견
  # SSG에 데이터 인라인 추가 작업 완료 후 다시 활성화 예정
  # push:
  #   branches: [main]
  #   paths:
  #     - 'profile/index.html'
  #     - 'scripts/build-og-pages.js'
  #     - '.github/workflows/build-og.yml'
  # schedule:
  #   - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build OG pages
        run: node scripts/build-og-pages.js

      - name: Commit & push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add profile/
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
          else
            git commit -m "build(og): 회사별 OG 페이지 자동 갱신 [skip ci]"
            git push
          fi
