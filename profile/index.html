<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신뢰 프로필</title>
<meta name="description" content="검증된 청소 전문가의 신뢰 프로필 — 작업 기록·실제 후기·인증 정보">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --ink: #0F172A;
    --ink-2: #334155;
    --muted: #64748B;
    --muted-2: #94A3B8;
    --line: #E2E8F0;
    --line-2: #F1F5F9;
    --paper: #FFFFFF;
    --bg: #F8FAFC;
    --primary: #2563EB;
    --primary-strong: #1D4ED8;
    --kakao: #FEE500;
    --kakao-ink: #181600;
    --gold: #F59E0B;
  }
  html, body {
    font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    line-height: 1.55;
    letter-spacing: -0.01em;
  }
  img { display: block; max-width: 100%; }
  a { color: inherit; text-decoration: none; }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
    background: var(--paper);
    min-height: 100vh;
  }

  /* ─── Top bar ─── */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line-2);
    background: var(--paper);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 800;
    color: var(--ink);
    letter-spacing: -0.02em;
  }
  .brand-badge {
    width: 18px; height: 18px;
    background: var(--primary);
    border-radius: 5px;
    color: #fff;
    font-size: 11px;
    font-weight: 900;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .share-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 7px 12px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink-2);
    background: transparent;
    border: none;
    cursor: pointer;
  }
  .share-btn:hover { background: var(--line-2); }

  /* ─── Hero ─── */
  .hero { padding: 20px 18px 16px; }
  .hero-row {
    display: flex;
    align-items: flex-start;
    gap: 16px;
  }
  .avatar {
    width: 86px; height: 86px;
    border-radius: 50%;
    background: var(--line-2);
    flex-shrink: 0;
    overflow: hidden;
    position: relative;
    border: 1px solid var(--line);
  }
  .avatar img {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .avatar-fallback {
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    color: var(--muted-2);
    background: linear-gradient(135deg, #EFF6FF, #DBEAFE);
  }
  .avatar-dot {
    position: absolute;
    bottom: 4px; right: 4px;
    width: 14px; height: 14px;
    background: #22C55E;
    border: 2px solid var(--paper);
    border-radius: 50%;
  }
  .hero-info {
    flex: 1;
    min-width: 0;
    padding-top: 4px;
  }
  .hero-tag {
    display: inline-block;
    background: #EFF6FF;
    color: var(--primary);
    padding: 3px 9px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 800;
    margin-bottom: 8px;
    letter-spacing: -0.02em;
  }
  .hero-name {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -0.04em;
    line-height: 1.2;
    margin-bottom: 5px;
  }
  .verified {
    color: var(--primary);
    font-size: 18px;
    line-height: 1;
  }
  .hero-sub {
    font-size: 13px;
    color: var(--ink-2);
    line-height: 1.5;
    letter-spacing: -0.02em;
  }
  .rating-row {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
    font-size: 13px;
    color: var(--ink);
    font-weight: 700;
  }
  .star { color: var(--gold); }
  .rating-count { color: var(--muted); font-weight: 500; }
  .arrow-mini { color: var(--muted-2); font-size: 11px; }

  /* ─── Stats row ─── */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    padding: 16px 0;
    border-top: 1px solid var(--line-2);
    border-bottom: 1px solid var(--line-2);
    margin: 4px 0 16px;
  }
  .stat {
    text-align: center;
    padding: 0 4px;
    border-right: 1px solid var(--line-2);
  }
  .stat:last-child { border-right: none; }
  .stat-label {
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 6px;
    letter-spacing: -0.02em;
  }
  .stat-value {
    font-size: 16px;
    font-weight: 900;
    color: var(--ink);
    letter-spacing: -0.03em;
  }
  .stat-value.primary { color: var(--primary); }

  /* ─── CTAs ─── */
  .cta-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 0 18px 18px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 14px 12px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: -0.02em;
    border: none;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.15s, transform 0.15s;
  }
  .btn:active { transform: scale(0.98); opacity: 0.92; }
  .btn-primary {
    background: var(--primary);
    color: #fff;
  }
  .btn-outline {
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--line);
  }

  /* ─── Section title ─── */
  .section { padding: 22px 18px 6px; }
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .section-title {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--ink);
  }
  .section-more {
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
  }

  /* ─── Recent work cards (horizontal scroll) ─── */
  .work-list {
    display: flex;
    gap: 10px;
    padding: 0 18px 6px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .work-list::-webkit-scrollbar { display: none; }
  .work-card {
    flex: 0 0 auto;
    width: 250px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    scroll-snap-align: start;
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .work-card:active { transform: scale(0.98); }
  .work-photo {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: var(--line-2);
    overflow: hidden;
  }
  .work-photo img {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .work-photo-empty {
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #EFF6FF, #DBEAFE);
    font-size: 32px;
    color: var(--muted-2);
  }
  .work-date-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(15, 23, 42, 0.78);
    color: #fff;
    padding: 4px 9px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: -0.02em;
    backdrop-filter: blur(4px);
  }
  .work-meta {
    padding: 13px 14px 14px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .work-region {
    font-size: 14px;
    font-weight: 800;
    color: var(--ink);
    letter-spacing: -0.03em;
    margin-bottom: 3px;
  }
  .work-spec {
    font-size: 12.5px;
    color: var(--ink-2);
    font-weight: 500;
    margin-bottom: 10px;
    letter-spacing: -0.02em;
  }
  .work-photo-count {
    font-size: 11.5px;
    color: var(--muted);
    font-weight: 500;
    margin-bottom: 12px;
  }
  .work-report-btn {
    margin-top: auto;
    color: var(--primary);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  /* ─── Trust badges ─── */
  .badge-list {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    padding: 0 18px;
  }
  .badge-card {
    flex: 1 1 calc(25% - 8px);
    min-width: 76px;
    max-width: 130px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 6px 12px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .badge-icon {
    width: 40px;
    height: 40px;
    background: var(--primary);
    color: #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 9px;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
  }
  .badge-icon svg {
    width: 19px;
    height: 19px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .badge-label {
    font-size: 11.5px;
    font-weight: 800;
    color: var(--ink);
    line-height: 1.35;
    letter-spacing: -0.03em;
  }
  .badge-criteria {
    font-size: 10px;
    color: var(--muted);
    font-weight: 500;
    line-height: 1.4;
    margin-top: 5px;
    letter-spacing: -0.02em;
  }
  /* 비활성 — 흐리게 표시 */
  .badge-card.inactive {
    background: var(--bg);
    border-color: var(--line-2);
  }
  .badge-card.inactive .badge-icon {
    background: var(--muted-2);
    box-shadow: none;
    opacity: 0.85;
  }
  .badge-card.inactive .badge-label {
    color: var(--muted);
  }
  .badge-card.inactive .badge-criteria {
    color: var(--muted-2);
  }

  /* ─── Review card ─── */
  .rev-list {
    padding: 0 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .rev-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .rev-rating {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 800;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .rev-rating .star { font-size: 14px; }
  .rev-content {
    font-size: 13.5px;
    color: var(--ink-2);
    line-height: 1.55;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
    word-break: keep-all;
  }
  .rev-meta {
    font-size: 11.5px;
    color: var(--muted);
    font-weight: 500;
    letter-spacing: -0.02em;
  }

  /* ─── Coming soon notice ─── */
  .coming-soon {
    margin: 16px 18px;
    padding: 28px 24px;
    background: var(--line-2);
    border-radius: 14px;
    text-align: center;
    color: var(--muted);
  }
  .coming-soon h3 {
    font-size: 14px;
    font-weight: 800;
    color: var(--ink-2);
    margin-bottom: 8px;
    letter-spacing: -0.02em;
  }
  .coming-soon p {
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--muted);
  }
  .coming-soon .small {
    margin-top: 12px;
    font-size: 11px;
    color: var(--muted-2);
  }

  /* ─── Footer ─── */
  .foot {
    margin-top: 28px;
    padding: 24px 18px 40px;
    text-align: center;
    border-top: 1px solid var(--line-2);
    background: var(--line-2);
  }
  .foot-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    color: var(--muted);
    font-weight: 600;
  }
  .lock { font-size: 10px; }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <span class="brand">
      <span class="brand-badge">클</span>
      <span>클매 신뢰 프로필</span>
    </span>
    <button class="share-btn" onclick="shareThisPage()">
      <span>↗</span>
      <span>공유하기</span>
    </button>
  </header>

  <section class="hero">
    <div class="hero-row">
      <div class="avatar">
        <div class="avatar-fallback" data-avatar-fallback>👤</div>
        <span class="avatar-dot"></span>
      </div>
      <div class="hero-info">
        <span class="hero-tag" data-hero-tag>대표 직접 시공</span>
        <h1 class="hero-name">
          <span data-company-name>업체명</span>
          <span class="verified">✓</span>
        </h1>
        <p class="hero-sub" data-hero-sub>하루 한 집, 대표가 직접 청소합니다.</p>
        <div class="rating-row">
          <span class="star">★</span>
          <span data-rating>-</span>
          <span class="rating-count">· 후기 <span data-review-count>0</span>개</span>
          <span class="arrow-mini">›</span>
        </div>
      </div>
    </div>
  </section>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">누적 작업</div>
      <div class="stat-value"><span data-jobs-count>0</span>건</div>
    </div>
    <div class="stat">
      <div class="stat-label">실제 후기</div>
      <div class="stat-value"><span data-review-count2>0</span>개</div>
    </div>
    <div class="stat">
      <div class="stat-label">최근 작업</div>
      <div class="stat-value primary" data-last-work>—</div>
    </div>
    <div class="stat">
      <div class="stat-label">사업자 인증</div>
      <div class="stat-value" data-verified-label>—</div>
    </div>
  </div>

  <div class="cta-row">
    <button class="btn btn-primary">💬  견적 받기</button>
    <button class="btn btn-outline">📞  전화하기</button>
  </div>

  <section class="section">
    <div class="section-head">
      <div class="section-title">최근 작업 기록</div>
      <span class="section-more">전체 보기 ›</span>
    </div>
  </section>
  <div data-recent-work-list>
    <div class="coming-soon" data-work-empty>
      <h3>아직 작업 기록이 없어요</h3>
      <p>사장님이 작성한 실제 작업 리포트가<br>이 자리에 자동으로 채워질 예정입니다.</p>
    </div>
  </div>

  <section class="section">
    <div class="section-head">
      <div class="section-title">최근 고객 후기</div>
      <span class="section-more">전체 보기 ›</span>
    </div>
  </section>
  <div data-reviews-list>
    <div class="coming-soon" data-reviews-empty>
      <h3>아직 후기가 없어요</h3>
      <p>고객이 작성한 후기가<br>이 자리에 자동으로 채워질 예정입니다.</p>
    </div>
  </div>

  <section class="section" data-badges-section>
    <div class="section-head">
      <div class="section-title">신뢰 배지</div>
      <span class="section-more">자세히 보기 ›</span>
    </div>
  </section>
  <div data-badges-list></div>

  <footer class="foot">
    <a href="/" class="foot-link">
      <span class="lock">🔒</span>
      <span>cleaningmanager.kr</span>
    </a>
  </footer>

</div>

<script>
  function shareThisPage() {
    if (navigator.share) {
      navigator.share({
        title: document.title,
        url: window.location.href
      }).catch(function() {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(window.location.href);
      alert('주소가 복사됐어요');
    }
  }
</script>

</body>
</html>
