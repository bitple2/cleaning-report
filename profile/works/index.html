<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>작업 기록</title>
<meta name="description" content="검증된 청소 전문가의 실제 작업 기록 전체">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --ink: #0F172A;
    --ink-2: #334155;
    --muted: #64748B;
    --muted-2: #94A3B8;
    --line: #E2E8F0;
    --line-2: #F1F5F9;
    --paper: #FFFFFF;
    --bg: #F8FAFC;
    --primary: #2563EB;
  }
  html, body {
    font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    line-height: 1.55;
    letter-spacing: -0.01em;
  }
  img { display: block; max-width: 100%; }
  a { color: inherit; text-decoration: none; }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    background: var(--paper);
    min-height: 100vh;
  }

  /* Top bar */
  .top {
    display: flex;
    align-items: center;
    padding: 12px 8px;
    border-bottom: 1px solid var(--line-2);
    background: var(--paper);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .top-back {
    width: 36px; height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    font-size: 18px;
  }
  .top-title {
    flex: 1;
    text-align: center;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .top-spacer { width: 36px; }

  /* Summary */
  .summary {
    padding: 16px 18px 4px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .summary-label {
    font-size: 12.5px;
    color: var(--muted);
    font-weight: 600;
  }
  .summary-count {
    font-size: 16px;
    font-weight: 900;
    color: var(--primary);
    letter-spacing: -0.03em;
  }
  .summary-count-unit {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-2);
  }

  /* Works list */
  .works-list {
    padding: 8px 18px 4px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .work-row {
    display: flex;
    gap: 12px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px;
    text-decoration: none;
    color: inherit;
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .work-row:active { transform: scale(0.99); }
  .work-row:hover { box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06); }
  .work-thumb {
    position: relative;
    width: 92px;
    height: 92px;
    flex-shrink: 0;
    border-radius: 8px;
    overflow: hidden;
    background: var(--line-2);
  }
  .work-thumb img {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .work-thumb-empty {
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    background: linear-gradient(135deg, #EFF6FF, #DBEAFE);
    color: var(--muted-2);
  }
  .work-date-badge {
    position: absolute;
    top: 6px;
    left: 6px;
    background: rgba(15, 23, 42, 0.78);
    color: #fff;
    padding: 3px 7px;
    border-radius: 5px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .work-meta {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    padding: 2px 0;
  }
  .work-region {
    font-size: 14px;
    font-weight: 800;
    color: var(--ink);
    letter-spacing: -0.03em;
    margin-bottom: 2px;
  }
  .work-spec {
    font-size: 12.5px;
    color: var(--ink-2);
    font-weight: 600;
    margin-bottom: 6px;
    letter-spacing: -0.02em;
  }
  .work-photo-count {
    font-size: 11px;
    color: var(--muted);
    font-weight: 500;
  }
  .work-report-link {
    margin-top: auto;
    font-size: 12px;
    font-weight: 800;
    color: var(--primary);
    letter-spacing: -0.02em;
  }

  /* Pagination */
  .pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 5px;
    padding: 22px 18px 40px;
    flex-wrap: wrap;
  }
  .page-btn {
    min-width: 36px;
    height: 36px;
    padding: 0 10px;
    border-radius: 7px;
    background: var(--paper);
    border: 1px solid var(--line);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-2);
    font-family: inherit;
    cursor: pointer;
    letter-spacing: -0.02em;
  }
  .page-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
  }
  .page-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  .page-btn.disabled {
    opacity: 0.35;
    pointer-events: none;
  }
  .page-ellipsis {
    color: var(--muted-2);
    padding: 0 4px;
    font-weight: 700;
  }

  /* Empty */
  .empty {
    padding: 60px 24px;
    text-align: center;
    color: var(--muted);
  }
  .empty h3 {
    font-size: 14px;
    font-weight: 800;
    color: var(--ink-2);
    margin-bottom: 8px;
  }
  .empty p {
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.6;
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <a href="../" class="top-back" aria-label="뒤로">←</a>
    <div class="top-title">작업 기록</div>
    <div class="top-spacer"></div>
  </header>

  <div class="summary">
    <span class="summary-label">총</span>
    <span class="summary-count" data-total-count>0</span>
    <span class="summary-count-unit">건</span>
  </div>

  <div class="works-list" data-works-list></div>

  <div class="pagination" data-pagination></div>

</div>

<script>
  const PER_PAGE = 50;
  let _currentPage = 1;
  let _allWorks = [];

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function init() {
    try {
      _allWorks = JSON.parse(document.body.dataset.worksJson || '[]');
    } catch (_) {
      _allWorks = [];
    }
    document.querySelector('[data-total-count]').textContent = _allWorks.length;
    if (_allWorks.length === 0) {
      document.querySelector('[data-works-list]').innerHTML =
        '<div class="empty">' +
          '<h3>아직 작업 기록이 없어요</h3>' +
          '<p>사장님이 작성한 실제 작업 리포트가<br>여기에 자동으로 채워질 예정입니다.</p>' +
        '</div>';
      return;
    }
    // URL ?p= 파라미터 확인 (지원 — 직접 링크로 진입 시)
    const urlPage = parseInt(new URLSearchParams(location.search).get('p') || '1');
    const totalPages = Math.ceil(_allWorks.length / PER_PAGE);
    renderPage(Math.max(1, Math.min(urlPage, totalPages)));
  }

  function renderPage(page) {
    _currentPage = page;
    const start = (page - 1) * PER_PAGE;
    const items = _allWorks.slice(start, start + PER_PAGE);
    document.querySelector('[data-works-list]').innerHTML =
      items.map(workRow).join('');
    renderPagination();
    // URL 동기화 (뒤로가기 작동 위해 pushState)
    const url = new URL(location.href);
    if (page === 1) url.searchParams.delete('p');
    else url.searchParams.set('p', String(page));
    history.replaceState(null, '', url.toString());
    window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  }

  function workRow(w) {
    const dt = new Date(w.date);
    const dateStr = (dt.getMonth() + 1) + '월 ' + dt.getDate() + '일';
    const region = esc(w.address_region || '—');
    const pyeong = w.size_pyeong != null ? w.size_pyeong : '—';
    const service = esc(w.service_type || '');
    const photoCount = w.photo_count || 0;
    const photoHtml = w.photo_url
      ? '<img src="' + esc(w.photo_url) + '" alt="">'
      : '<div class="work-thumb-empty">📷</div>';
    return '<a class="work-row" href="/?id=' +
      encodeURIComponent(w.report_id) + '&public=1">' +
      '<div class="work-thumb">' + photoHtml +
        '<span class="work-date-badge">' + dateStr + '</span></div>' +
      '<div class="work-meta">' +
        '<div class="work-region">' + region + '</div>' +
        '<div class="work-spec">' + pyeong + '평 · ' + service + '</div>' +
        '<div class="work-photo-count">사진 ' + photoCount + '장</div>' +
        '<div class="work-report-link">리포트 보기 ›</div>' +
      '</div></a>';
  }

  function renderPagination() {
    const totalPages = Math.ceil(_allWorks.length / PER_PAGE);
    const pag = document.querySelector('[data-pagination]');
    if (totalPages <= 1) { pag.innerHTML = ''; return; }
    const parts = [];
    // 이전
    parts.push(
      '<button class="page-btn' + (_currentPage === 1 ? ' disabled' : '') +
        '" onclick="renderPage(' + (_currentPage - 1) + ')">←</button>');
    // 번호: 1, current±1, total (간단 ellipsis)
    const pages = new Set([1, totalPages, _currentPage - 1, _currentPage, _currentPage + 1]);
    const visible = Array.from(pages).filter(p => p >= 1 && p <= totalPages).sort((a, b) => a - b);
    let prev = 0;
    for (const p of visible) {
      if (p - prev > 1) parts.push('<span class="page-ellipsis">…</span>');
      parts.push(
        '<button class="page-btn' + (p === _currentPage ? ' active' : '') +
          '" onclick="renderPage(' + p + ')">' + p + '</button>');
      prev = p;
    }
    // 다음
    parts.push(
      '<button class="page-btn' + (_currentPage === totalPages ? ' disabled' : '') +
        '" onclick="renderPage(' + (_currentPage + 1) + ')">→</button>');
    pag.innerHTML = parts.join('');
  }

  init();
</script>

</body>
</html>
